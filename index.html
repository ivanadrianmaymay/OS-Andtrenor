<style>
  :root{
    --bg:#0A0A0A; --surface:#141412; --elevated:#1C1C19; --line:rgba(255,255,255,.08);
    --accent:#F26B1F; --accent-soft:rgba(242,107,31,.14); --accent-border:rgba(242,107,31,.32);
    --text:#F5F5F0; --text-dim:rgba(245,245,240,.62); --text-mute:rgba(245,245,240,.36); --text-faint:rgba(245,245,240,.22);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; width:100%;
  }
  p, h1, h2, h3, .text-xs, .text-sm, .text-base, .num-lg, .eyebrow, input, textarea, .badge{ overflow-wrap:break-word; word-break:break-word; }
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2A2A26;border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:#3A3A34;}
  input,select,textarea{color-scheme:dark; font-family:inherit;}
  select option, select optgroup{background:#1C1C19; color:#F5F5F0;}
  .tabular{font-variant-numeric:tabular-nums;}
  .hidden{display:none !important;}
  .animate-fade{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  button{font-family:inherit; cursor:pointer;}

  /* layout */
  .app-shell{min-height:100vh; display:flex; flex-direction:column;}
  .main{flex:1; min-width:0;}
  .content-wrap{padding:16px; max-width:1120px; margin:0 auto; overflow-x:hidden;}
  .topbar{position:sticky; top:0; z-index:20; background:rgba(10,10,10,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .sidebar{border-bottom:1px solid var(--line); background:rgba(20,20,18,.75); backdrop-filter:blur(10px); position:sticky; top:0; z-index:30;}
  .sidebar-head{padding:14px 16px 4px; display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .brand{font-size:21px; font-weight:800; letter-spacing:-0.01em; line-height:1; margin:0;}
  .brand span{color:var(--accent);}
  .brand-sub{font-size:11px; color:var(--text-mute); margin:3px 0 0;}
  .nav-wrap{position:relative;}
  .nav{display:flex; overflow-x:auto; gap:4px; padding:6px 12px 12px; -webkit-overflow-scrolling:touch;}
  .nav-fade-right{position:absolute; top:0; right:0; bottom:12px; width:28px; pointer-events:none; background:linear-gradient(to right, transparent, var(--surface) 75%); border-radius:0 0 4px 0;}
  @media(min-width:900px){ .nav-fade-right{display:none;} }
  .nav-customize-toggle, .nav-group-label{display:none;}
  @media(min-width:768px){ .nav-customize-toggle, .nav-group-label{display:block;} }
  .sidebar-foot{display:none;}
  .mobile-only{display:inline-flex !important;}
  .desktop-only{display:none !important;}
  @media (min-width:900px){
    .app-shell{flex-direction:row;}
    .sidebar{width:246px; flex-shrink:0; height:100vh; position:sticky; top:0; border-bottom:none; border-right:1px solid var(--line); display:flex; flex-direction:column;}
    .nav{flex-direction:column; overflow-y:auto; overflow-x:visible; padding:8px 12px; flex:1 1 auto; min-height:0; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;}
    .nav::-webkit-scrollbar{width:6px;}
    .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:3px;}
    .nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);}
    .sidebar-foot{display:block; margin-top:auto; padding:16px; border-top:1px solid var(--line);}
    .content-wrap{padding:32px;}
    .mobile-only{display:none !important;}
    .desktop-only{display:block !important;}
  }
  .nav-item{display:flex; align-items:center; gap:10px; padding:8px 13px; border-radius:10px; white-space:nowrap; color:var(--text-dim); border:1px solid transparent; background:none; font-size:14px; flex-shrink:0;}
  .nav-item:hover{color:var(--text); background:rgba(255,255,255,.05);}
  .nav-item.active{background:var(--accent-soft); border-color:var(--accent-border); color:var(--text);}
  .nav-badge{margin-left:auto; font-size:10px;}
  .nav-badge-alert{margin-left:auto; font-size:10px; font-weight:700; background:#ef4444; color:#fff; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
  .icon-btn{background:none; border:none; color:var(--text-faint); padding:7px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
  .icon-btn:hover{color:var(--text-dim);}
  .icon-btn.danger:hover{color:#f87171;}
  .icon-btn.ok:hover{color:#34D399;}
  .icon-btn[disabled]{opacity:.22; pointer-events:none;}

  /* typography */
  .h1{font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0;}
  @media(min-width:640px){ .h1{font-size:30px;} }
  .h2{font-size:17px; font-weight:700; margin:0;}
  .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.16em; color:var(--text-mute); font-weight:700; margin:0;}
  .text-xs{font-size:12px;} .text-sm{font-size:13px;} .text-base{font-size:14.5px;}
  .muted{color:var(--text-dim);} .mute2{color:var(--text-mute);} .mute3{color:var(--text-faint);}
  .accent-text{color:var(--accent);} .italic{font-style:italic;} .strike{text-decoration:line-through;}
  .good-text{color:#34D399;} .bad-text{color:#f87171;}
  .num-hero{font-size:42px; font-weight:800; letter-spacing:-0.02em; line-height:1;}

function sanitizeForInstagram(text){
  return String(text||'')
    .replace(/[^\S\r\n]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .split('\n').map(l => l.trim()).join('\n')
    .trim();
}

function sortShotsForBatching(items){
  return items.slice().sort((a,b) => {
    const r = ROLL_TYPES.indexOf(a.roll||'Talking Head') - ROLL_TYPES.indexOf(b.roll||'Talking Head');
    if (r !== 0) return r;
    const loc = (a.location||'').localeCompare(b.location||'');
    if (loc !== 0) return loc;
    return (a.outfit||'').localeCompare(b.outfit||'');
  });
}

/* =========================================================
   STORAGE — resilient save with a retry queue.
   The occasional "Unexpected response type" error comes from
   Anthropic's storage bridge itself (not app logic) and is
   usually transient, so instead of giving up we keep retrying
   in the background until it succeeds, and surface a status
   indicator + manual retry button rather than silently failing.
========================================================= */
let storageWarned = false;
let dataLoadWarning = false;
let dataLoadRetryInProgress = false;
let appMeta = { lastBackupAt: null };
let pendingSaves = {};      // key -> JSON payload not yet confirmed saved
let storageRetryTimer = null;
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

const loadFailedKeys = new Set();
/* =========================================================
   MULTI-STORE PERSISTENCE (redundant, self-healing)
   Instead of trusting one storage mechanism, every write goes
   to THREE independent stores in parallel:
     1. window.storage  — the artifact bridge (syncs across devices)
     2. localStorage    — instant, synchronous, survives refresh
     3. IndexedDB       — larger quota, survives refresh
   Each write is stamped with a timestamp. On load we read all
   three and keep whichever has the NEWEST stamp, then re-heal the
   others. A single failing store can no longer lose your data —
   it would take all three failing at once, which effectively
   doesn't happen. localStorage in particular is synchronous, so
   it lands before a refresh can interrupt it.
========================================================= */
const LS_PREFIX = 'osa_';
const IDB_DB = 'os-antrenor-data';
const IDB_STORE = 'kv';

function lsSet(key, stamped){
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(stamped)); return true; }
  catch(e){ return false; }
}
function lsGet(key){
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function lsDelete(key){ try { localStorage.removeItem(LS_PREFIX + key); } catch(e){} }

function openDataDB(){
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no idb')); return; }
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, stamped){
  try {
    const db = await openDataDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(stamped, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    return true;
  } catch(e){ return false; }
}
async function idbGet(key){
  try {
    const db = await openDataDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e){ return null; }
}
async function idbDelete(key){
  try {
    const db = await openDataDB();
    db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(key);
  } catch(e){}
}

async function loadKey(key, fallback){
  // Read every store, keep the newest — a store that's stale, empty or
  // broken simply loses the comparison instead of destroying your data.
  const candidates = [];

  const local = lsGet(key);
  if (local && local.t) candidates.push({ src: 'local', t: local.t, v: local.v });

  const idb = await idbGet(key);
  if (idb && idb.t) candidates.push({ src: 'idb', t: idb.t, v: idb.v });

  let bridgeFailed = false;
  if (STORAGE_OK) {
    const backoffs = [250, 500];
    let got = false;
    for (let attempt = 0; attempt <= backoffs.length && !got; attempt++) {
      try {
        const r = await window.storage.get(key, false);
        got = true;
        if (r && r.value) {
          const parsed = JSON.parse(r.value);
          // Older builds wrote the bare value; newer ones write {t, v}
          if (parsed && typeof parsed === 'object' && parsed.t && 'v' in parsed) candidates.push({ src: 'bridge', t: parsed.t, v: parsed.v });
          else candidates.push({ src: 'bridge', t: 0, v: parsed });
        }
      } catch(e) {
        if (attempt < backoffs.length) await sleep(backoffs[attempt]);
        else bridgeFailed = true;
      }
    }
  }

  if (!candidates.length) {
    if (bridgeFailed) loadFailedKeys.add(key); else loadFailedKeys.delete(key);
    return fallback;
  }

  loadFailedKeys.delete(key);
  candidates.sort((a, b) => b.t - a.t);
  const winner = candidates[0];

  // Re-heal any store that's behind, so all three converge again.
  const stamped = { t: winner.t || Date.now(), v: winner.v };
  candidates.forEach(c => { if (c.src !== winner.src && c.t < winner.t) healStore(c.src, key, stamped); });
  ['local','idb','bridge'].forEach(src => { if (!candidates.some(c => c.src === src)) healStore(src, key, stamped); });

  return winner.v === undefined ? fallback : winner.v;
}
function healStore(src, key, stamped){
  if (src === 'local') lsSet(key, stamped);
  else if (src === 'idb') idbSet(key, stamped);
  else if (src === 'bridge' && STORAGE_OK) { try { const pr = window.storage.set(key, JSON.stringify(stamped), false); if (pr && pr.catch) pr.catch(() => {}); } catch(e){} }
}
async function retryFailedLoads(){
  if (!loadFailedKeys.size) return true;
  const keys = Array.from(loadFailedKeys);
  const results = await Promise.all(keys.map(async k => ({ k, v: await loadKey(k, undefined) })));
  let allOk = true;
  results.forEach(({k, v}) => {
    if (loadFailedKeys.has(k)) { allOk = false; return; }
    applyRecoveredKey(k, v);
  });
  render();
  return allOk;
}
function applyRecoveredKey(key, value){
  if (value === undefined) return;
  const map = {
    goal:'goal', calendar:'calendar', leads:'leads', content:'content', resources:'resources',
    activity:'activity', links:'links', trackedAccounts:'trackedAccounts', streak:'streak', ads:'ads', testimonials:'testimonials',
    shotList:'shotList', brand:'brand', gamification:'gamification', storyVault:'storyVault',
  };
  if (key === 'leads') { state.leads = normalizeLeads(value); return; }
  if (key === 'notes') { notesState = value; return; }
  if (key === 'meta') { appMeta = value; return; }
  if (key === 'checklist') {
    if (value && value.date === todayISO()) state.checklist = value;
    return;
  }
  if (map[key]) state[map[key]] = value;
}
async function attemptSave(key, payload){
  try { await window.storage.set(key, payload, false); return true; }
  catch(e){ return false; }
}
async function saveKey(key, value){
  scheduleSyncFileWrite();
  scheduleGoogleDriveWrite();
  const stamped = { t: Date.now(), v: value };

  // localStorage is synchronous — it lands immediately, even if the user
  // refreshes a split second later. This alone fixes the refresh-loss case.
  const localOk = lsSet(key, stamped);
  idbSet(key, stamped); // fire-and-forget; also survives refresh

  if (!STORAGE_OK) { updateSyncStatus(); return; }

  const payload = JSON.stringify(stamped);
  pendingSaves[key] = payload;
  let ok = await attemptSave(key, payload);
  if (!ok) { await sleep(400); ok = await attemptSave(key, payload); }
  if (!ok) { await sleep(1200); ok = await attemptSave(key, payload); }
  if (ok) {
    if (pendingSaves[key] === payload) delete pendingSaves[key];
    updateSyncStatus();
  } else {
    console.warn('Bridge save failed for', key, '— but local copies are safe');
    // Not a data-loss risk any more: localStorage + IndexedDB already hold it.
    if (localOk && pendingSaves[key] === payload) delete pendingSaves[key];
    updateSyncStatus();
    if (!localOk && !storageWarned) {
      storageWarned = true;
      toast('Salvarea automată are o problemă momentan — datele rămân active în sesiune și se sincronizează automat imediat ce revine conexiunea.', 'error');
    }

  }
}
async function flushPendingSaves(){
  const keys = Object.keys(pendingSaves);
  if (!keys.length) return;
  let clearedAny = false;
  for (const key of keys) {
    const payload = pendingSaves[key];
    const ok = await attemptSave(key, payload);
    if (ok && pendingSaves[key] === payload) { delete pendingSaves[key]; clearedAny = true; }
  }
  updateSyncStatus();
  if (syncOpen) renderOverlay();
  if (clearedAny && !Object.keys(pendingSaves).length) toast('Toate datele s-au sincronizat ✓');
}
function ensureRetryTimer(){
  if (storageRetryTimer) return;
  storageRetryTimer = setInterval(() => {
    flushPendingSaves().then(() => {
      if (!Object.keys(pendingSaves).length && storageRetryTimer) { clearInterval(storageRetryTimer); storageRetryTimer = null; }
    });
  }, 20000);
}
function updateSyncStatus(){
  const badge = document.getElementById('sync-status-badge');
  if (!badge) return;
  const n = Object.keys(pendingSaves).length;
  badge.textContent = n ? String(n) : '';
  badge.classList.toggle('hidden', n === 0);
}
async function deleteKey(key){
  // Must clear ALL stores, otherwise a "reset" would silently come back
  // from one of the redundant copies on the next load.

  idbDelete(key);
  if (!STORAGE_OK) return;

}

function logActivity(type, text, amount){
  const entry = { id: uid(), ts: new Date().toISOString(), type, text, amount: (typeof amount === 'number' ? amount : null) };
  state.activity.push(entry);
  if (state.activity.length > ACTIVITY_LIMIT) state.activity = state.activity.slice(-ACTIVITY_LIMIT);
  return entry;
}
function activityInPeriod(period){
  const now = new Date();
  let from;
  if (period === 'week') {
    const day = now.getDay();
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    from = new Date(now); from.setDate(now.getDate() + diffToMonday); from.setHours(0,0,0,0);
  } else {
    from = new Date(now); from.setHours(0,0,0,0);
  }
  return state.activity.filter(a => new Date(a.ts) >= from).slice().reverse();
}

function buildExportPayload(){

    version: 5,
    data: {
      goal: state.goal, checklist: state.checklist, calendar: state.calendar,
      leads: state.leads, content: state.content, resources: state.resources,
      activity: state.activity, notes: notesState, links: state.links, trackedAccounts: state.trackedAccounts, savedLinks: state.savedLinks,
      navOrder: state.navOrder, qualifyConfig: QUALIFY_FIELDS, settings: state.settings,
      streak: state.streak, ads: state.ads, testimonials: state.testimonials, shotList: state.shotList,
      brand: state.brand, gamification: state.gamification, storyVault: state.storyVault,
    },
  };
}
function applyImportedData(parsed){
  const d = parsed && parsed.data ? parsed.data : parsed;
  if (!d || typeof d !== 'object' || (!d.goal && !d.leads && !d.checklist)) return false;
  state.goal = d.goal || state.goal;
  state.checklist = d.checklist || state.checklist;
  state.calendar = d.calendar || state.calendar;
  state.leads = normalizeLeads(d.leads || state.leads);
  state.content = d.content || state.content;
  state.resources = d.resources || state.resources;
  state.activity = d.activity || state.activity;
  state.links = d.links || state.links;
  state.trackedAccounts = d.trackedAccounts || state.trackedAccounts;
  state.savedLinks = d.savedLinks || state.savedLinks;
  state.navOrder = d.navOrder || state.navOrder;
  if (d.settings) state.settings = d.settings;
  if (d.qualifyConfig) {
    QUALIFY_FIELDS = JSON.parse(JSON.stringify(DEFAULT_QUALIFY_FIELDS));
    Object.keys(d.qualifyConfig).forEach(k => { QUALIFY_FIELDS[k] = d.qualifyConfig[k]; });
    saveKey('qualifyConfig', QUALIFY_FIELDS);
  }
  state.streak = d.streak || state.streak;
  state.ads = d.ads || state.ads;
  state.testimonials = d.testimonials || state.testimonials;
  state.shotList = d.shotList || state.shotList;
  state.brand = d.brand || state.brand;
  state.gamification = d.gamification || state.gamification;
  state.storyVault = d.storyVault || state.storyVault;
  if (d.notes) notesState = d.notes;

}

function exportData(){

/* =========================================================
   AUTO-SYNC TO A LOCAL FILE (File System Access API)
   Only supported in Chromium desktop browsers (Chrome/Edge).
   Not available in Safari, Firefox, or most in-app WebViews —
   in those cases we simply hide this option and point people
   at the manual Export / Copy-to-clipboard flow instead, since
   there is no way for a webpage to silently write into an
   arbitrary Drive/iCloud/OneDrive folder without this API and
   an explicit one-time file picker grant from the person.

   The file handle itself is NOT storable in window.storage or
   localStorage (only plain strings survive there) — it has to
   live in IndexedDB, the one browser store that can hold this
   kind of object across a refresh. Even then, browsers require
   a fresh user tap to re-confirm write permission after a
   reload (a security rule, not a bug) — we detect that case and
   surface a single "Reconectează" button rather than silently
   losing the connection.
========================================================= */
let syncFileHandle = null;
let syncFileWriteTimer = null;
let syncFileNeedsReconnect = false;
const SYNC_DB_NAME = 'os-antrenor-sync';
const SYNC_STORE_NAME = 'handles';
function isFileSystemAccessSupported(){ return !!window.showSaveFilePicker; }
function openSyncDB(){
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no indexeddb')); return; }
    const req = indexedDB.open(SYNC_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(SYNC_STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveSyncHandleToDB(handle){
  try {
    const db = await openSyncDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(SYNC_STORE_NAME, 'readwrite');
      tx.objectStore(SYNC_STORE_NAME).put(handle, 'fileHandle');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch(e){ console.warn('Could not persist sync file handle to IndexedDB', e); }
}
async function loadSyncHandleFromDB(){
  try {
    const db = await openSyncDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(SYNC_STORE_NAME, 'readonly');
      const req = tx.objectStore(SYNC_STORE_NAME).get('fileHandle');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e){ return null; }
}
async function clearSyncHandleFromDB(){
  try {
    const db = await openSyncDB();
    db.transaction(SYNC_STORE_NAME, 'readwrite').objectStore(SYNC_STORE_NAME).delete('fileHandle');
  } catch(e){}
}
async function tryRestoreSyncHandle(){
  if (!isFileSystemAccessSupported() || !window.indexedDB) return;
  try {
    const handle = await Promise.race([
      loadSyncHandleFromDB(),
      new Promise(resolve => setTimeout(() => resolve(null), 1500)),
    ]);
    if (!handle) return;
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    syncFileHandle = handle;
    syncFileNeedsReconnect = (perm !== 'granted');
    if (!syncFileNeedsReconnect) {
      await readSyncFile(true);
      startSyncFilePolling();
    }
  } catch(e){
    await clearSyncHandleFromDB();
  }
}
async function reconnectSyncFile(){
  if (!syncFileHandle) return;
  try {
    const perm = await syncFileHandle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      syncFileNeedsReconnect = false;
      await readSyncFile(true);
      startSyncFilePolling();
      toast('Reconectat — auto-sync activ din nou');
    } else {
      toast('Permisiune refuzată — alege din nou fișierul dacă vrei auto-sync', 'error');
      syncFileHandle = null;
      await clearSyncHandleFromDB();
    }
  } catch(e){ toast('Nu am putut reconecta', 'error'); }
  if (syncOpen) renderOverlay();
}
function scheduleSyncFileWrite(){
  if (!syncFileHandle || syncFileNeedsReconnect) return;
  clearTimeout(syncFileWriteTimer);
  syncFileWriteTimer = setTimeout(writeSyncFile, 1500);
}
async function writeSyncFile(){
  if (!syncFileHandle || syncFileNeedsReconnect) return;
  try {
    const payload = buildExportPayload();
    const writable = await syncFileHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    // This device's own write IS the latest known state — remember its
    // stamp so the next read-back (ours or a poll) doesn't re-apply it.
    appMeta.syncFileLastAppliedAt = payload.exportedAt;
    markBackedUp();
  } catch(e){
    console.warn('Auto-sync file write failed', e);
    if (e.name === 'NotAllowedError') { syncFileNeedsReconnect = true; if (syncOpen) renderOverlay(); }
  }
}
/* =========================================================
   READING BACK FROM THE SYNCED FILE — the other half of
   auto-sync. Without this, the file was write-only: this device
   would push its own changes out, but never notice that another
   device (writing to that same file, e.g. via a Google Drive /
   OneDrive / iCloud folder kept in sync by the OS) had moved it
   forward. We compare the file's `exportedAt` stamp against the
   newest stamp this device has already seen/written — only ever
   pulling in a file that's strictly newer, so this device's own
   writes are never re-imported, and an older/stale file can never
   clobber newer local data.
========================================================= */
async function readSyncFile(auto){
  if (!syncFileHandle || syncFileNeedsReconnect) return;
  try {
    const file = await syncFileHandle.getFile();
    const text = await file.text();
    if (!text || !text.trim()) return; // freshly-created empty file — nothing to pull yet
    let parsed;
    try { parsed = JSON.parse(text); } catch(e){ return; }
    if (!parsed || !parsed.exportedAt || !parsed.data) { if (!auto) toast('Fișierul nu are un backup valid încă', 'error'); return; }
    const fileTime = new Date(parsed.exportedAt).getTime();
    const knownTime = appMeta.syncFileLastAppliedAt ? new Date(appMeta.syncFileLastAppliedAt).getTime() : 0;
    if (!fileTime || fileTime <= knownTime) { if (!auto) toast('Ești deja la zi — nimic nou în fișier'); return; }
    if (auto) {
      // Never yank data out from under someone mid-keystroke — a background
      // check simply tries again next time (next poll, or next focus).
      const active = document.activeElement;
      const isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
      if (isEditing) return;
    }
    const ok = applyImportedData(parsed);
    if (ok) {
      appMeta.syncFileLastAppliedAt = parsed.exportedAt;
      saveMeta();
      toast(auto ? 'Date actualizate de pe alt dispozitiv ☁' : 'Date aduse din fișierul sincronizat');
    } else if (!auto) {
      toast('Fișierul nu are structura așteptată', 'error');
    }
  } catch(e){
    console.warn('Auto-sync file read failed', e);
    if (!auto) toast('Nu am putut citi fișierul', 'error');
  }
}
let syncFilePollTimer = null;
function startSyncFilePolling(){
  stopSyncFilePolling();
  if (!syncFileHandle) return;
  // A safety-net background check — the focus/visibility listeners below
  // cover "came back to this device", this covers "left both tabs open
  // side by side" without needing to click away and back.
  syncFilePollTimer = setInterval(() => readSyncFile(true), 90000);
}
function stopSyncFilePolling(){
  if (syncFilePollTimer) { clearInterval(syncFilePollTimer); syncFilePollTimer = null; }
}
async function chooseSyncFile(){
  if (!isFileSystemAccessSupported()) { toast('Nedisponibil în acest browser — folosește Export sau Copiază mai jos', 'error'); return; }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'os-antrenor-sync.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    syncFileHandle = handle;
    syncFileNeedsReconnect = false;
    await saveSyncHandleToDB(handle);
    // If this file already holds real data — most likely because another
    // device already set up sync and picked this same file — pull it in
    // instead of blindly overwriting it with whatever's on THIS device.
    let pulledExisting = false;
    try {
      const file = await handle.getFile();
      const text = await file.text();
      if (text && text.trim()) {
        const parsed = JSON.parse(text);
        if (parsed && parsed.exportedAt && parsed.data) {
          const hasLocalData = state.leads.length || state.calendar.posts.length ||
            Object.values(state.content.ideas || {}).some(list => (list||[]).length);
          const shouldPull = !hasLocalData || confirm(
            'Fișierul ales are deja date salvate (probabil de pe alt dispozitiv). Le aduci pe acest dispozitiv acum?\n\n' +
            'Recomandat — altfel le suprascrii cu ce ai pe acest dispozitiv.'
          );
          if (shouldPull && applyImportedData(parsed)) {
            appMeta.syncFileLastAppliedAt = parsed.exportedAt;
            saveMeta();
            pulledExisting = true;
          }
        }
      }
    } catch(e){ /* not valid JSON yet — treat it as a brand new file */ }
    if (!pulledExisting) await writeSyncFile();
    startSyncFilePolling();
    toast(pulledExisting ? 'Auto-sync activat — date aduse din fișier' : 'Auto-sync activat — rămâne conectat și după refresh');
    if (syncOpen) renderOverlay();
  } catch(e){ if (e.name !== 'AbortError') toast('Nu am putut alege fișierul', 'error'); }
}
function disconnectSyncFile(){
  syncFileHandle = null;
  syncFileNeedsReconnect = false;
  stopSyncFilePolling();
  clearSyncHandleFromDB();
  if (syncOpen) renderOverlay();
  toast('Auto-sync oprit');
}

/* =========================================================
   GOOGLE DRIVE AUTO-SYNC — the cross-device option that also
   works on a phone (the File System Access section above only
   works in Chrome/Edge on desktop). Uses Google Identity
   Services for a client-side OAuth token — no server, no client
   secret needed — and talks to the Drive API v3 directly via
   fetch(). Scope is drive.file, the narrowest Drive scope that
   exists: this app can only ever see/write the ONE file it
   creates for itself, never the rest of the person's Drive.

   Requires a Google Cloud OAuth Client ID pasted into
   GOOGLE_CLIENT_ID below — until then this whole section stays
   hidden in the Sync overlay (mirrors how the file-sync section
   hides itself on unsupported browsers).

   Known fragility, disclosed in the UI itself: silently
   refreshing the access token on return visits depends on the
   browser allowing a background call to accounts.google.com —
   Safari on iPhone often blocks this (ITP / third-party cookie
   rules), so that device may need an occasional manual
   "Reconectează" tap instead of it just working invisibly the
   way it usually does on desktop Chrome.
========================================================= */
const GOOGLE_CLIENT_ID = '964772057012-dv9t3ujqj84tbvf9ig2j43jjoj275ipa.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GOOGLE_SYNC_FILENAME = 'os-antrenor-sync.json';
function isGoogleDriveConfigured(){ return !!GOOGLE_CLIENT_ID; }

let gDriveTokenClient = null;
let gDriveAccessToken = null;
let gDriveTokenExpiresAt = 0;
let gDriveFileId = null;
let gDriveNeedsReconnect = false;
let gDriveWriteTimer = null;
let gDrivePollTimer = null;
let gDriveBusy = false;

function waitForGoogleIdentity(timeoutMs){
  return new Promise((resolve) => {
    const start = Date.now();
    (function check(){
      if (window.google && window.google.accounts && window.google.accounts.oauth2) { resolve(true); return; }
      if (Date.now() - start > timeoutMs) { resolve(false); return; }
      setTimeout(check, 150);
    })();
  });
}
function ensureGoogleTokenClient(){
  if (gDriveTokenClient) return gDriveTokenClient;
  if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
  gDriveTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_DRIVE_SCOPE,
    callback: () => {}, // overridden per-call in requestGoogleToken
  });
  return gDriveTokenClient;
}
// Requests a fresh access token. `interactive` controls whether Google is
// allowed to show a consent/account picker screen — false is used for the
// silent "try to reuse the existing grant" path (page load, background
// polling), true is used for the explicit "Conectează Google Drive" tap.
async function requestGoogleToken(interactive){
  const available = await waitForGoogleIdentity(interactive ? 6000 : 3000);
  if (!available) return false;
  const client = ensureGoogleTokenClient();
  if (!client) return false;
  return new Promise((resolve) => {
    client.callback = (resp) => {
      if (resp && resp.access_token) {
        gDriveAccessToken = resp.access_token;
        gDriveTokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
        gDriveNeedsReconnect = false;
        resolve(true);
      } else {
        resolve(false);
      }
    };
    client.error_callback = () => resolve(false);
    try { client.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){ resolve(false); }
  });
}
async function driveGetValidToken(interactive){
  if (gDriveAccessToken && Date.now() < gDriveTokenExpiresAt) return gDriveAccessToken;
  const ok = await requestGoogleToken(interactive);
  return ok ? gDriveAccessToken : null;
}
// Finds the sync file this app created earlier (on this device or another
// one signed into the same Google account), or creates it the very first
// time. The id is cached in appMeta so later saves/reads skip the search.
async function driveEnsureFileId(token){
  if (gDriveFileId) return gDriveFileId;
  if (appMeta.gDriveFileId) { gDriveFileId = appMeta.gDriveFileId; return gDriveFileId; }
  const q = encodeURIComponent("name='" + GOOGLE_SYNC_FILENAME + "' and trashed=false");
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)', {
    headers: { Authorization: 'Bearer ' + token },
  });
  if (!res.ok) throw new Error('drive list failed: ' + res.status);
  const data = await res.json();
  if (data.files && data.files.length) {
    gDriveFileId = data.files[0].id;
  } else {
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: GOOGLE_SYNC_FILENAME }),
    });
    if (!createRes.ok) throw new Error('drive create failed: ' + createRes.status);
    const created = await createRes.json();
    gDriveFileId = created.id;
  }
  appMeta.gDriveFileId = gDriveFileId;
  saveMeta();
  return gDriveFileId;
}
function scheduleGoogleDriveWrite(){
  if (!appMeta.gDriveConnected || gDriveNeedsReconnect) return;
  clearTimeout(gDriveWriteTimer);
  gDriveWriteTimer = setTimeout(driveWrite, 1500);
}
async function driveWrite(){
  if (!appMeta.gDriveConnected || gDriveNeedsReconnect || gDriveBusy) return;
  gDriveBusy = true;
  try {
    const token = await driveGetValidToken(false);
    if (!token) { gDriveNeedsReconnect = true; if (syncOpen) renderOverlay(); return; }
    const fileId = await driveEnsureFileId(token);
    const payload = buildExportPayload();
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('drive write failed: ' + res.status);
    // This device's own write IS the latest known state — remember its
    // stamp so the next read-back (ours or a poll) doesn't re-apply it.
    appMeta.driveLastAppliedAt = payload.exportedAt;
    saveMeta();
    markBackedUp();
  } catch(e){
    console.warn('Google Drive write failed', e);
  } finally {
    gDriveBusy = false;
  }
}
async function driveRead(auto){
  if (!appMeta.gDriveConnected || gDriveNeedsReconnect || gDriveBusy) return;
  gDriveBusy = true;
  try {
    const token = await driveGetValidToken(false);
    if (!token) { gDriveNeedsReconnect = true; if (syncOpen) renderOverlay(); return; }
    const fileId = await driveEnsureFileId(token);
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!res.ok) throw new Error('drive read failed: ' + res.status);
    const text = await res.text();
    if (!text || !text.trim()) return; // freshly-created empty file — nothing to pull yet
    let parsed;
    try { parsed = JSON.parse(text); } catch(e){ return; }
    if (!parsed || !parsed.exportedAt || !parsed.data) { if (!auto) toast('Fișierul din Drive nu are un backup valid încă', 'error'); return; }
    const fileTime = new Date(parsed.exportedAt).getTime();
    const knownTime = appMeta.driveLastAppliedAt ? new Date(appMeta.driveLastAppliedAt).getTime() : 0;
    if (!fileTime || fileTime <= knownTime) { if (!auto) toast('Ești deja la zi — nimic nou în Drive'); return; }
    if (auto) {
      // Never yank data out from under someone mid-keystroke — a background
      // check simply tries again next time (next poll, or next focus).
      const active = document.activeElement;
      const isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
      if (isEditing) return;
    }
    const ok = applyImportedData(parsed);
    if (ok) {
      appMeta.driveLastAppliedAt = parsed.exportedAt;
      saveMeta();
      toast(auto ? 'Date actualizate din Google Drive ☁' : 'Date aduse din Google Drive');
    } else if (!auto) {
      toast('Fișierul din Drive nu are structura așteptată', 'error');
    }
  } catch(e){
    console.warn('Google Drive read failed', e);
    if (!auto) toast('Nu am putut citi din Google Drive', 'error');
  } finally {
    gDriveBusy = false;
  }
}
function startGoogleDrivePolling(){
  stopGoogleDrivePolling();
  gDrivePollTimer = setInterval(() => driveRead(true), 90000);
}
function stopGoogleDrivePolling(){
  if (gDrivePollTimer) { clearInterval(gDrivePollTimer); gDrivePollTimer = null; }
}
async function connectGoogleDrive(){
  if (!isGoogleDriveConfigured()) { toast('Google Drive nu e configurat încă în aplicație', 'error'); return; }
  const client = ensureGoogleTokenClient();
  if (!client) {
    const available = await waitForGoogleIdentity(4000);
    if (!available || !ensureGoogleTokenClient()) { toast('Serviciul Google nu s-a încărcat — verifică conexiunea și reîncearcă', 'error'); return; }
  }
  const ok = await requestGoogleToken(true);
  if (!ok) { toast('Conectarea la Google a fost anulată sau a eșuat', 'error'); return; }
  try {
    const fileId = await driveEnsureFileId(gDriveAccessToken);
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
      headers: { Authorization: 'Bearer ' + gDriveAccessToken },
    });
    // Same safety net as the local-file connect flow: if the file already
    // has data (from another device signed into the same account), ask
    // before silently overwriting it with whatever's on THIS device.
    let pulledExisting = false;
    if (res.ok) {
      const text = await res.text();
      if (text && text.trim()) {
        try {
          const parsed = JSON.parse(text);
          if (parsed && parsed.exportedAt && parsed.data) {
            const hasLocalData = state.leads.length || state.calendar.posts.length ||
              Object.values(state.content.ideas || {}).some(list => (list||[]).length);
            const shouldPull = !hasLocalData || confirm(
              'Fișierul din Google Drive are deja date salvate (probabil de pe alt dispozitiv). Le aduci pe acest dispozitiv acum?\n\n' +
              'Recomandat — altfel le suprascrii cu ce ai pe acest dispozitiv.'
            );
            if (shouldPull && applyImportedData(parsed)) {
              appMeta.driveLastAppliedAt = parsed.exportedAt;
              pulledExisting = true;
            }
          }
        } catch(e){ /* not valid JSON yet — treat as brand new file */ }
      }
    }
    appMeta.gDriveConnected = true;
    gDriveNeedsReconnect = false;
    saveMeta();
    if (!pulledExisting) await driveWrite();
    startGoogleDrivePolling();
    toast(pulledExisting ? 'Google Drive conectat — date aduse din Drive' : 'Google Drive conectat — rămâne conectat și după refresh');
  } catch(e){
    console.warn('Google Drive connect failed', e);
    toast('Nu am putut conecta Google Drive', 'error');
  }
  if (syncOpen) renderOverlay();
}
async function reconnectGoogleDrive(){
  const ok = await requestGoogleToken(true);
  if (ok) {
    gDriveNeedsReconnect = false;
    await driveRead(true);
    startGoogleDrivePolling();
    toast('Reconectat la Google Drive — auto-sync activ din nou');
  } else {
    toast('Reconectarea a eșuat — încearcă din nou', 'error');
  }
  if (syncOpen) renderOverlay();
}
function disconnectGoogleDrive(){
  appMeta.gDriveConnected = false;
  gDriveNeedsReconnect = false;
  gDriveAccessToken = null;
  gDriveTokenExpiresAt = 0;
  stopGoogleDrivePolling();
  saveMeta();
  if (syncOpen) renderOverlay();
  toast('Google Drive deconectat');
}
// Called at startup: if this device connected before, try to silently pick
// the grant back up (no popup) so auto-sync resumes without a tap. If the
// browser blocks the silent reissue (common on iPhone Safari, which limits
// third-party cookies), we surface a single "Reconectează" button instead
// of failing silently.
async function tryRestoreGoogleDrive(){
  if (!isGoogleDriveConfigured() || !appMeta.gDriveConnected) return;
  const ok = await requestGoogleToken(false);
  if (ok) {
    gDriveNeedsReconnect = false;
    await driveRead(true);
    startGoogleDrivePolling();
  } else {
    gDriveNeedsReconnect = true;
  }
  if (syncOpen) renderOverlay();
}

/* =========================================================
   COMPUTED
========================================================= */
function normalizeLeads(leads){
  const now = new Date().toISOString();
  return (leads || []).map(l => ({
    paid: 0, payments: [], updatedAt: now, qualify: {}, startDate: '',
    archived: false, tags: [], referredBy: '', packageDurationDays: 90,
    discoveryChecklist: {}, mainObjection: '', milestones: [],
    referralReward: '', referralCount: 0,
    churnCheckins: false, churnResults: false, churnCommunication: false,
    followupReason: '', followupDescription: '',
    ...l,
  }));
}
function allChecklistIds(){
  const ids = [];
  Object.keys(state.checklist.categories).forEach(cat => {
    (state.checklist.categories[cat].tasks || []).forEach(t => ids.push(t.id));
  });
  return ids;
}
function computeChecklistStats(){
  const ids = allChecklistIds();
  const total = ids.length;
  const done = ids.filter(id => state.checklist.checked[id]).length;
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function computeGoalStats(){
  // Prefer LIVE numbers derived straight from the CRM's real closed clients —
  // this is what was disconnected before: a payment recorded on a lead never
  // moved this headline number, because it came from two manually-typed
  // fields instead of the actual data. Once real clients exist, use them;
  // the manual chips only remain as a fallback for a brand-new account with
  // nothing in CRM yet.
  const activeClients = state.leads.filter(l => isActiveClient(l) && !l.archived);
  const liveData = activeClients.length > 0;
  const clients = liveData ? activeClients.length : (Number(state.goal.clients) || 0);
  // "Recurring" only means something once it's normalized to a monthly rate —
  // a 600€/90-day package isn't 600€ of MONTHLY revenue, it's 200€/month.
  // Multiplying full package value straight by client count (the old bug)
  // overstated MRR by up to 3x for the app's own default 90-day packages.
  const avgPrice = liveData
    ? Math.round(activeClients.reduce((s,l) => {
        const durationDays = Number(l.packageDurationDays) || 90;
        return s + (Number(l.value)||0) / (durationDays/30);
      }, 0) / activeClients.length)
    : (Number(state.goal.avgPrice) || 0);
  const target = Number(state.goal.target) || DEFAULT_TARGET_MRR;
  const mrr = clients * avgPrice;
  // Separately, actual cash position — money still owed is NOT revenue until
  // it's collected, so it must never be folded into "Venit" as if it were.
  const collected = liveData ? activeClients.reduce((s,l) => s + (Number(l.paid)||0), 0) : 0;
  const stillOwed = liveData ? activeClients.reduce((s,l) => s + Math.max(0, (Number(l.value)||0) - (Number(l.paid)||0)), 0) : 0;
  const pct = Math.max(0, Math.min(100, target > 0 ? (mrr/target)*100 : 0));
  const remaining = Math.max(0, target - mrr);
  const clientsNeeded = avgPrice > 0 ? Math.max(0, Math.ceil(remaining/avgPrice)) : null;
  const deadline = new Date((state.goal.deadline || DEFAULT_DEADLINE) + 'T23:59:59');
  const now = new Date();
  const msLeft = deadline - now;
  const daysLeft = Math.max(0, Math.ceil(msLeft/(1000*60*60*24)));
  const monthsLeft = Math.max(0.1, daysLeft/30.44);
  const pace = (clientsNeeded !== null) ? (clientsNeeded/monthsLeft) : null;
  return { mrr, pct, remaining, clientsNeeded, daysLeft, monthsLeft, pace, target, clients, avgPrice, liveData, collected, stillOwed };
}
function computeUrgentLeads(){
  const t = todayISO();
  // Follow-ups matter regardless of status — a client who's already closed
  // can still need a check-in call just as urgently as a fresh prospect.
  return state.leads.filter(l => !l.archived && l.followup && l.followup <= t);
}
function computeTodayPosts(){
  const t = todayISO();
  return state.calendar.posts.filter(p => p.date === t);
}
function computeOutstandingBalance(){
  // Only actual clients (status Închis) can owe a balance — a prospect's
  // estimated deal value is pipeline potential, not money they've been
  // invoiced for. Mixing the two overstates "rest de încasat" with money
  // that was never actually billed.
  return state.leads.filter(l => isActiveClient(l) && !l.archived)
    .reduce((sum, l) => sum + Math.max(0, (Number(l.value)||0) - (Number(l.paid)||0)), 0);
}
function computeSmartAlerts(){
  const alerts = [];
  const now = new Date();
  const STALE_MS = 3 * 24 * 60 * 60 * 1000;

  const staleLeads = state.leads.filter(l => l.status !== 'Închis' && l.status !== 'Retain' && l.updatedAt && (now - new Date(l.updatedAt)) > STALE_MS);
  if (staleLeads.length) alerts.push({ level: 'warn', text: staleLeads.length + ' lead-uri nu au mai fost atinse de peste 3 zile', tab: 'crm' });

  const urgent = computeUrgentLeads();
  if (urgent.length) alerts.push({ level: 'danger', text: urgent.length + ' lead-uri au follow-up programat azi sau mai devreme', tab: 'crm' });

  const twoDaysAgo = new Date(now.getTime() - 2*24*60*60*1000);
  const recentPosted = state.calendar.posts.filter(p => p.status === 'postat' && new Date(p.date + 'T12:00:00') >= twoDaysAgo);
  if (!recentPosted.length) alerts.push({ level: 'warn', text: 'Nicio postare marcată "Postat" în ultimele 2 zile', tab: 'calendar' });

  const cs = computeChecklistStats();
  if (now.getHours() >= 18 && cs.pct < 100) alerts.push({ level: 'warn', text: 'Checklist-ul zilei nu e terminat ('+cs.pct+'%)', tab: 'checklist' });

  const outstanding = computeOutstandingBalance();
  if (outstanding > 0) alerts.push({ level: 'info', text: formatEUR(outstanding) + ' de încasat de la clienți cu rate restante', tab: 'crm' });

  const retention = computeRetentionAlerts();
  retention.forEach(r => {
    alerts.push({
      level: r.level,
      text: r.lead.name + ' ajunge la finalul pachetului în ' + r.daysUntil + ' zile — programează apelul de reînnoire.',
      tab: 'crm',
      leadId: r.lead.id,
      renewalAction: true,
    });
  });

  const fourDaysAgo = new Date(); fourDaysAgo.setDate(fourDaysAgo.getDate() - 4);
  const recentSalesStories = state.storyVault.items.filter(s => s.arcName === 'Oferta Directă High-Ticket' && new Date(s.createdAt) >= fourDaysAgo);
  if (!recentSalesStories.length) alerts.push({ level: 'warn', text: '0 Story-uri de conversie directă în ultimele 4 zile — generează o secvență de Vânzare', tab: 'calendar' });

  return alerts;
}
function computeInsights(){
  const statusCounts = {};
  LEAD_STATUSES.forEach(s => statusCounts[s] = 0);
  const pipelineLeads = state.leads.filter(l => !l.archived);
  pipelineLeads.forEach(l => { statusCounts[l.status] = (statusCounts[l.status]||0) + 1; });
  const total = pipelineLeads.length;
  const closed = statusCounts['Închis'] || 0;
  const retain = statusCounts['Retain'] || 0;
  const convertible = total - retain;
  const conversionRate = convertible > 0 ? Math.round(closed/convertible*100) : 0;
  const closedLeads = pipelineLeads.filter(l => l.status === 'Închis');
  const avgDeal = closedLeads.length ? closedLeads.reduce((s,l) => s + (Number(l.value)||0), 0) / closedLeads.length : 0;

  const pillarCounts = {};
  Object.keys(PILLARS).forEach(k => { pillarCounts[k] = { total: 0, postat: 0 }; });
  state.calendar.posts.forEach(p => { if (pillarCounts[p.pillar]) { pillarCounts[p.pillar].total++; if (p.status === 'postat') pillarCounts[p.pillar].postat++; } });
  const maxPillarTotal = Math.max(1, ...Object.values(pillarCounts).map(c => c.total));

  return { statusCounts, total, conversionRate, avgDeal, pillarCounts, maxPillarTotal };
}
function computeActiveMonths(startDate){
  if (!startDate) return null;
  const start = new Date(startDate + 'T00:00:00');
  const now = new Date();
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
function computeActiveDays(startDate){
  if (!startDate) return null;
  const start = new Date(startDate + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - start) / (24*60*60*1000)));
}
function computePaymentPace(lead){
  // Only meaningful for someone genuinely mid-installment: has started,
  // has paid SOME but not ALL of the package, and the package hasn't
  // already run out (past that point it's a renewal/overdue conversation,
  // not a normal "still paying it off" situation).
  if (!lead.startDate) return null;
  const value = Number(lead.value) || 0;
  const paid = Number(lead.paid) || 0;
  if (value <= 0 || paid <= 0 || paid >= value) return null;
  const duration = Number(lead.packageDurationDays) || 90;
  const activeDays = computeActiveDays(lead.startDate);
  if (activeDays > duration) return null;
  const paidPct = Math.round((paid/value)*100);
  const timePct = Math.round((activeDays/duration)*100);
  return { paidPct, timePct, onTrack: paidPct >= timePct, remainingDays: duration - activeDays };
}
function computeRenewalStatus(lead){
  if (!lead.startDate || (lead.status !== 'Închis' && lead.status !== 'Retain') || lead.archived) return null;
  const warnDays = Number(state.settings.renewalWarnDays) || 15;
  const dangerDays = Number(state.settings.renewalDangerDays) || 5;
  const duration = Number(lead.packageDurationDays) || 90;
  const activeDays = computeActiveDays(lead.startDate);
  const daysUntil = duration - activeDays;
  if (daysUntil < 0 || daysUntil > warnDays) return null;
  return { daysUntil, level: daysUntil <= dangerDays ? 'danger' : 'warn' };
}
function computeRetentionAlerts(){
  // Dynamic against each client's OWN package length, not a fixed 90-day
  // assumption — a 60-day package hits its "15 days left" mark on day 45,
  // not day 75. This is the same math computeRenewalPipeline uses.
  const warnDays = Number(state.settings.renewalWarnDays) || 15;
  const dangerDays = Number(state.settings.renewalDangerDays) || 5;
  return state.leads
    .filter(l => l.startDate && (l.status === 'Închis' || l.status === 'Retain') && !l.archived)
    .map(l => {
      const duration = Number(l.packageDurationDays) || 90;
      const activeDays = computeActiveDays(l.startDate);
      const daysUntil = duration - activeDays;
      return { lead: l, days: activeDays, daysUntil };
    })
    .filter(x => x.daysUntil >= 0 && x.daysUntil <= warnDays)
    .map(x => ({ lead: x.lead, days: x.days, daysUntil: x.daysUntil, level: x.daysUntil <= dangerDays ? 'danger' : 'warn' }));
}
function computeRenewalPipeline(){
  const warnDays = Number(state.settings.renewalWarnDays) || 15;
  return state.leads
    .filter(l => l.startDate && isActiveClient(l) && !l.archived)
    .map(l => {
      const duration = Number(l.packageDurationDays) || 90;
      const activeDays = computeActiveDays(l.startDate);
      const daysUntil = duration - activeDays;
      return { lead: l, daysUntil };
    })
    .filter(x => x.daysUntil >= 0 && x.daysUntil <= warnDays)
    .sort((a,b) => a.daysUntil - b.daysUntil);
}
function sendRenewalMessage(leadId){
  const lead = state.leads.find(l => l.id === leadId);
  if (!lead) return;
  const msg = 'Salut ' + lead.name + '! Pachetul tău se apropie de final. Mâine/poimâine vreau să facem un bilanț scurt și să stabilim obiectivul pentru următoarea etapă. Când ai 10 minute liber?';
  copyToClipboard(msg);
}
function sendOnboardingMessage(leadId){
  const lead = state.leads.find(l => l.id === leadId);
  if (!lead) return;
  const link = state.brand.baseLink || '[LINK_AICI]';
  const msg = 'Salut ' + lead.name + '! Bine ai venit în echipă! 🚀 Primul pas este să accesezi link-ul de onboarding de mai jos pentru a configura tot ce avem nevoie:\n\n' + link + '\n\nDupă ce ai finalizat, dă-mi un semn!';
  copyToClipboard(msg);
  logActivity('lead', 'Mesaj onboarding trimis: ' + lead.name);
  toast('Mesaj de onboarding copiat — lipește-l pe WhatsApp');
}

let newMilestoneOpenFor = null;
function toggleNewMilestoneInput(leadId){
  newMilestoneOpenFor = newMilestoneOpenFor === leadId ? null : leadId;

function computeRevenueForecast90(){
  const active = state.leads.filter(l => isActiveClient(l) && !l.archived);
  const perClient = active.map(l => {
    const durationDays = Number(l.packageDurationDays) || 90;
    const monthlyValue = (Number(l.value) || 0) / (durationDays / 30);
    return { name: l.name, monthlyValue };
  });
  const monthlyTotal = perClient.reduce((s, c) => s + c.monthlyValue, 0);
  return {
    activeCount: active.length,
    monthlyTotal,
    forecast90: monthlyTotal * 3,
    perClient,
  };
}
function computeMonthlyPL(){
  const now = new Date();
  const paymentsThisMonth = state.activity.filter(a => a.type === 'payment' && sameMonth(a.ts, now));
  const revenue = paymentsThisMonth.reduce((s,a) => s + (Number(a.amount)||0), 0);
  const ads = computeAdsMetrics();
  const netProfit = revenue - ads.budget;
  const newClients = state.activity.filter(a => a.type === 'lead_closed' && sameMonth(a.ts, now)).length;
  const churnedThisMonth = state.activity.filter(a => a.type === 'lead_reopened' && sameMonth(a.ts, now)).length;
  const closedAllTime = state.leads.filter(l => isActiveClient(l)).length;
  const churnRate = closedAllTime > 0 ? (churnedThisMonth / closedAllTime) * 100 : 0;
  const ins = computeInsights();
  // ROAS here must be based on the SAME "revenue" this report headlines
  // (actual cash collected), not the deal-value-based figure computeAdsMetrics
  // uses for its own (separately-labeled) card — otherwise "Venit încasat"
  // and "ROAS" stop reconciling with each other in the one report that puts
  // them side by side.
  const roas = ads.budget > 0 ? (revenue / ads.budget) * 100 : null;
  return {
    revenue, adBudget: ads.budget, netProfit,
    cpl: ads.cpl, cac: ads.cac, roas,
    newClients, churnRate, conversionRate: ins.conversionRate,
  };
}

function checkStreakRollover(today){
  if (!state.streak.lastCompletedDate) return;
  const last = new Date(state.streak.lastCompletedDate + 'T00:00:00');
  const todayD = new Date(today + 'T00:00:00');
  const diffDays = Math.round((todayD - last) / (24*60*60*1000));
  if (diffDays > 1) state.streak.count = 0;
}
function registerStreakCompletion(){
  const today = todayISO();
  if (state.streak.lastCompletedDate === today) return;
  let diffDays = null;
  if (state.streak.lastCompletedDate) {
    const last = new Date(state.streak.lastCompletedDate + 'T00:00:00');
    const todayD = new Date(today + 'T00:00:00');
    diffDays = Math.round((todayD - last) / (24*60*60*1000));
  }
  state.streak.count = (diffDays === 1) ? state.streak.count + 1 : 1;
  state.streak.lastCompletedDate = today;
}
function computeAdsMetrics(){
  const budget = Number(state.ads.monthlyBudget) || 0;
  const now = new Date();
  const monthLeads = state.activity.filter(a => a.type === 'lead_added' && sameMonth(a.ts, now));
  const monthClosed = state.activity.filter(a => a.type === 'lead_closed' && sameMonth(a.ts, now));
  const revenue = monthClosed.reduce((s,a) => s + (Number(a.amount)||0), 0);
  const cpl = monthLeads.length ? budget / monthLeads.length : null;
  const cac = monthClosed.length ? budget / monthClosed.length : null;
  const roas = budget > 0 ? (revenue / budget) * 100 : null;
  return { budget, leadsThisMonth: monthLeads.length, closedThisMonth: monthClosed.length, cpl, cac, roas, revenue };
}
function sameMonth(iso, ref){

/* =========================================================
   GAMIFICATION ENGINE (Module 6) — lightweight, all client-side
========================================================= */
const XP_LEVELS = [
  { level: 1,  name: 'Novice Coach',       xp: 0 },
  { level: 2,  name: 'Coach Activ',        xp: 300 },
  { level: 3,  name: 'Coach Constant',     xp: 800 },
  { level: 4,  name: 'Coach Solid',        xp: 1600 },
  { level: 5,  name: 'Coach Avansat',      xp: 2800 },
  { level: 6,  name: 'Expert Local',       xp: 4500 },
  { level: 7,  name: 'Expert Recunoscut',  xp: 7000 },
  { level: 8,  name: 'Autoritate',         xp: 10500 },
  { level: 9,  name: 'Business Builder',   xp: 15000 },
  { level: 10, name: 'MASTER Builder',     xp: 21000 },
];
const STREAK_BADGES = [7, 14, 30, 90, 180, 365];
function vibrate(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }
function addXP(amount){
  // The streak multiplier badge (×1.5 / ×2) needs to actually apply here,
  // not just be a number shown next to the streak — otherwise it's a
  // decoration that lies about what it does.
  const boosted = Math.round(amount * computeStreakMultiplier());
  state.gamification.xp = (Number(state.gamification.xp) || 0) + boosted;
  saveKey('gamification', state.gamification);
  checkMilestones();
}
function computeLevel(){
  let current = XP_LEVELS[0];
  for (const lvl of XP_LEVELS) { if (state.gamification.xp >= lvl.xp) current = lvl; else break; }
  const idx = XP_LEVELS.indexOf(current);
  const next = XP_LEVELS[idx+1] || null;
  const progress = next ? Math.round(((state.gamification.xp - current.xp) / (next.xp - current.xp)) * 100) : 100;
  return { level: current.level, name: current.name, xp: state.gamification.xp, next, progress };
}
function computeStreakMultiplier(){
  const c = state.streak.count;
  if (c >= 30) return 2.0;
  if (c >= 7) return 1.5;
  return 1.0;
}
function checkMilestones(){
  const g = computeGoalStats();
  [1000, 2500, 5000].forEach(threshold => {
    const key = 'mrr_' + threshold;

function computeMomentum(){

  const storiesDone = computeTodayPosts().some(p => p.status === 'postat') ? 1 : 0;

  const parts = [

function getWeekDates(offset){
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday + offset*7);
  monday.setHours(0,0,0,0);
  const out = [];
  for (let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); out.push(d); }
  return out;
}

}

function setDayStoryType(iso, value){
  state.calendar.dayStoryType = state.calendar.dayStoryType || {};
  if (value) state.calendar.dayStoryType[iso] = value;
  else delete state.calendar.dayStoryType[iso];
  const weekday = new Date(iso + 'T00:00:00').getDay();
  state.calendar.weekdayStoryType = state.calendar.weekdayStoryType || {};
  if (value) state.calendar.weekdayStoryType[weekday] = { type: value, anchorDate: iso };
  saveKey('calendar', state.calendar);
}
function getEffectiveDayStoryType(iso){
  const explicit = (state.calendar.dayStoryType || {})[iso];
  if (explicit) return explicit;
  const weekday = new Date(iso + 'T00:00:00').getDay();
  const rec = (state.calendar.weekdayStoryType || {})[weekday];
  if (!rec) return '';
  const repeatWeeks = Number(state.calendar.contentTypeRepeatWeeks) || 1;
  if (repeatWeeks <= 1) return rec.type;
  const anchor = new Date(rec.anchorDate + 'T00:00:00');
  const thisDate = new Date(iso + 'T00:00:00');
  const weeksDiff = Math.round((thisDate - anchor) / (7*24*60*60*1000));
  return (weeksDiff % repeatWeeks === 0) ? rec.type : '';
}
function setDayContentType(iso, value){
  state.calendar.dayContentType = state.calendar.dayContentType || {};
  if (value) state.calendar.dayContentType[iso] = value;
  else delete state.calendar.dayContentType[iso];
  // Setting a day's type also updates that WEEKDAY's standing recommendation
  // going forward — so if Monday becomes "Educativ/Tehnic" today, next
  // Monday (and the one after, per the repeat interval) suggests the same
  // by default, without locking you out of overriding any single date.
  const weekday = new Date(iso + 'T00:00:00').getDay();
  state.calendar.weekdayContentType = state.calendar.weekdayContentType || {};
  if (value) state.calendar.weekdayContentType[weekday] = { type: value, anchorDate: iso };
  saveKey('calendar', state.calendar);
}
function getEffectiveDayType(iso){
  const explicit = (state.calendar.dayContentType || {})[iso];
  if (explicit) return explicit;
  const weekday = new Date(iso + 'T00:00:00').getDay();
  const rec = (state.calendar.weekdayContentType || {})[weekday];
  if (!rec) return '';

function exportShotListText(){

let filmingMode = false;
let filmingEnergyFilter = [];
let fabMenuOpen = false;
let filmingViewMode = 'list'; // 'list' | 'teleprompter'
let teleprompterIndex = 0;
let teleprompterSpeed = 1;
let teleprompterPlaying = false;
let teleprompterRAF = null;
function openFilmingMode(){
  if (!state.shotList.items.length) { toast('Adaugă întâi idei în Shot List', 'error'); return; }
  filmingMode = true;
  filmingViewMode = 'list';
  teleprompterIndex = 0;
  renderFilmingMode();
}
function closeFilmingMode(){
  filmingMode = false;
  stopTeleprompterScroll();
  teleprompterPlaying = false;
  renderFilmingMode();
}
function toggleFilmingViewMode(){
  filmingViewMode = filmingViewMode === 'list' ? 'teleprompter' : 'list';
  teleprompterIndex = 0;
  stopTeleprompterScroll();
  teleprompterPlaying = false;
  renderFilmingMode();
}
function setTeleprompterSpeed(spd){
  teleprompterSpeed = Number(spd);
  renderFilmingMode();
}
function toggleTeleprompterPlay(){
  teleprompterPlaying = !teleprompterPlaying;
  if (teleprompterPlaying) startTeleprompterScroll(); else stopTeleprompterScroll();
  renderFilmingMode();
}
function startTeleprompterScroll(){
  stopTeleprompterScroll();
  const step = () => {
    const el = document.getElementById('teleprompter-text');
    if (el) {
      el.scrollTop += teleprompterSpeed * 0.7;
      if (el.scrollTop >= el.scrollHeight - el.clientHeight - 2) { teleprompterPlaying = false; renderFilmingMode(); return; }
    }
    teleprompterRAF = requestAnimationFrame(step);
  };
  teleprompterRAF = requestAnimationFrame(step);
}
function stopTeleprompterScroll(){
  if (teleprompterRAF) cancelAnimationFrame(teleprompterRAF);
  teleprompterRAF = null;
}
function teleprompterNav(dir, total){
  stopTeleprompterScroll();
  teleprompterPlaying = false;
  teleprompterIndex = Math.max(0, Math.min(total - 1, teleprompterIndex + dir));
  renderFilmingMode();
}
function renderFilmingMode(){
  const root = document.getElementById('filming-mode-root');
  if (!filmingMode) { root.classList.add('hidden'); root.innerHTML = ''; return; }
  root.classList.remove('hidden');
  const total = state.shotList.items.length;
  const done = state.shotList.items.filter(s => s.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  let items = sortShotsForBatching(state.shotList.items);
  if (filmingEnergyFilter.length) items = items.filter(s => filmingEnergyFilter.includes(s.effort||'mediu'));

  if (filmingViewMode === 'teleprompter') {
    const idx = Math.max(0, Math.min(items.length - 1, teleprompterIndex));
    const shot = items[idx];
    root.innerHTML =
      '<div class="filming-mode">' +
        '<div class="flex items-center justify-between flex-wrap gap-2" style="margin-bottom:12px;">' +
          '<div><p class="h1" style="margin:0;">📜 Teleprompter</p><p class="text-sm mute2 tabular" style="margin-top:2px;">'+(items.length?(idx+1):0)+' / '+items.length+'</p></div>' +

            '<button data-action="toggle-filming-view" class="btn btn-sm">☰ Listă</button>' +
            '<button data-action="close-filming-mode" class="btn btn-primary">'+icon('x','icon-sm')+'Închide</button>' +
          '</div>' +
        '</div>' +
        (items.length ? (
          '<div id="teleprompter-text" style="flex:1; min-height:0; overflow-y:auto; background:#000; border-radius:14px; padding:32px 20px; margin-bottom:14px; scroll-behavior:auto;">' +
            '<p style="font-size:28px; line-height:1.6; font-weight:700; text-align:center; color:#fff;">'+escapeHtml(shot.text)+'</p>' +
          '</div>' +
          '<div class="flex items-center justify-center gap-2 flex-wrap" style="margin-bottom:10px;">' +
            [1,1.5,2].map(s => '<button data-action="set-teleprompter-speed" data-speed="'+s+'" class="status-pill'+(teleprompterSpeed===s?' active':'')+'"'+(teleprompterSpeed===s?' style="background:var(--accent);"':'')+'">'+s+'x</button>').join('') +
          '</div>' +
          '<div class="flex items-center justify-center gap-3">' +
            '<button data-action="teleprompter-nav" data-dir="-1" class="btn btn-icon">'+icon('chevronLeft','icon-sm')+'</button>' +
            '<button data-action="toggle-teleprompter-play" class="btn btn-primary" style="min-width:120px; justify-content:center;">'+(teleprompterPlaying?'⏸ Pauză':'▶ Derulează')+'</button>' +
            '<button data-action="teleprompter-nav" data-dir="1" class="btn btn-icon">'+icon('chevronRight','icon-sm')+'</button>' +
          '</div>'
        ) : '<p class="text-sm mute3 italic" style="text-align:center; padding:30px 0;">Niciun shot pentru filtrul ales.</p>') +
      '</div>';
    return;
  }

  root.innerHTML =
    '<div class="filming-mode">' +
      '<div class="flex items-center justify-between flex-wrap gap-2" style="margin-bottom:12px;">' +
        '<div><p class="h1" style="margin:0;">🚀 Sesiune Filmare Lot</p><p class="text-sm mute2 tabular" style="margin-top:2px;">'+done+' / '+total+' filmate</p></div>' +
        '<div class="flex gap-2">' +
          '<button data-action="toggle-filming-view" class="btn btn-sm">📜 Teleprompter</button>' +
          '<button data-action="close-filming-mode" class="btn btn-primary">'+icon('x','icon-sm')+'Închide</button>' +
        '</div>' +
      '</div>' +
      '<button data-action="export-shotlist-text" class="btn btn-sm w-full" style="justify-content:center; margin-bottom:12px;">'+icon('copy','icon-sm')+'Exportă Text / Copiază cadrele</button>' +
      '<div class="flex gap-2 flex-wrap" style="margin-bottom:14px;">' +
        EFFORT_TAGS.map(e => {
          const on = filmingEnergyFilter.includes(e.key);
          return '<button data-action="toggle-filming-energy" data-effort="'+e.key+'" class="status-pill'+(on?' active':'')+'"'+(on?' style="background:'+e.color+';"':'')+'>'+e.label+'</button>';

      '<div class="flex-col gap-3" style="display:flex; flex:1; overflow-y:auto;">' +
        (items.length ? items.map(s => {
          const pl = PILLARS[s.pillar] || PILLARS.tehnic;

          const meta = [s.location, s.outfit, s.prop].filter(Boolean);
          return '<button data-action="toggle-shot-done" data-id="'+s.id+'" class="card film-shot-card" style="'+(s.done?'opacity:.5;':'')+'">' +

              '<div class="flex items-center gap-2 flex-wrap" style="margin-bottom:4px;">' +
                '<span class="dot" style="background:'+pl.color+';"></span><span class="text-xs mute2">'+pl.label+'</span>' +
                '<span class="badge" style="font-size:10px;">'+(s.roll||'Talking Head')+'</span>' +
                '<span class="badge" style="font-size:10px; color:'+eff.color+'; border-color:'+eff.color+'44;">'+eff.label+'</span>' +
              '</div>' +
              '<p class="text-base" style="'+(s.done?'text-decoration:line-through;':'')+'">'+escapeHtml(s.text)+'</p>' +
              (meta.length ? '<p class="text-xs mute3 mt-2" style="margin-top:6px;">'+meta.map(escapeHtml).join(' · ')+'</p>' : '') +
            '</div>' +
          '</button>';
        }).join('') : '<p class="text-sm mute3 italic" style="text-align:center; padding:30px 0;">Niciun shot pentru filtrul ales.</p>') +
      '</div>' +
    '</div>';
}

/* =========================================================
   MUTATIONS — script templates
========================================================= */
function generateScript(){
  const select = document.getElementById('script-pillar-select');
  const pillar = select ? select.value : scriptState.pillar;
  const variants = state.content.scripts[pillar] || [];
  if (!variants.length) { scriptState = { pillar, current: null }; renderCalendar(); return; }
  let next;
  if (variants.length === 1) next = variants[0];
  else {
    do { next = variants[Math.floor(Math.random()*variants.length)]; }
    while (scriptState.current && next.id === scriptState.current.id && variants.length > 1);
  }
  scriptState = { pillar, current: next };
  renderCalendar();
}
function injectHook(){
  if (!scriptState.current) { scriptState.current = { hook: '', body: '', cta: '' }; }
  scriptState.current = { ...scriptState.current, hook: pickRandomHook(scriptState.current.hook) };
  renderCalendar();
}
function generateFullScript(){
  const pool = state.content.scripts[scriptState.pillar] || [];
  const base = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
  const hook = pickRandomHook();
  const body = base ? base.body : 'M — Motiv: de ce contează asta azi.\nA — Acțiune: ce faci concret, pas cu pas.\nI — Impact: rezultatul la care te poți aștepta.';
  const cta = state.brand.ctaText || (base ? base.cta : 'Scrie-mi în DM pentru detalii.');
  scriptState = { pillar: scriptState.pillar, current: { hook, body, cta } };
  renderCalendar();
  toast('Scenariu complet generat — 30s, structură M.A.I. + CTA-ul tău');
}
function copyScript(){
  if (!scriptState.current) return;
  const t = scriptState.current;
  copyToClipboard('HOOK: ' + t.hook + '\n\nBODY: ' + t.body + '\n\nCTA: ' + t.cta);
}
function copyScriptWithCTA(){
  if (!scriptState.current) return;
  if (state.brand.savedCTAs && state.brand.savedCTAs.length >= 2) {
    ctaPickerOpen = true;
    renderOverlay();
    return;
  }
  const t = scriptState.current;
  copyToClipboard(injectCTA('HOOK: ' + t.hook + '\n\nBODY: ' + t.body + '\n\nCTA: ' + t.cta));
  toast('Copiat cu CTA-ul activ');
}
function closeCtaPicker(){ ctaPickerOpen = false; renderOverlay(); }
function pickCtaForScript(ctaText){
  if (!scriptState.current) return;
  const t = scriptState.current;
  copyToClipboard('HOOK: ' + t.hook + '\n\nBODY: ' + t.body + '\n\nCTA: ' + ctaText);
  closeCtaPicker();
  toast('Copiat cu CTA-ul ales');
}
function saveScriptAsIdea(){
  if (!scriptState.current) return;
  const t = scriptState.current;
  const pillar = scriptState.pillar;
  pushUndo();
  state.content.ideas[pillar] = state.content.ideas[pillar] || [];
  state.content.ideas[pillar].unshift({ id: uid(), text: t.hook, hook: t.hook, body: t.body, cta: t.cta });
  saveKey('content', state.content);
  renderCalendar();
  toast('Salvat sus în banca de idei — ' + (PILLARS[pillar]||{}).label);
}
function addScript(pillar){
  pushUndo();
  const id = uid();

  state.content.scripts[pillar].push({ id, hook: '', body: '', cta: '' });

}
function startEditScript(pillar, id){ editScript = pillar + ':' + id; renderCalendar(); }
function cancelEditScript(pillar, id){
  const item = (state.content.scripts[pillar] || []).find(x => x.id === id);
  if (item && !item.hook && !item.body && !item.cta) {

function saveEditScript(pillar, id){

    source: source ? source.value : 'DM',

    paid: 0, payments: [], igLink: '', updatedAt: new Date().toISOString(),

function updateLeadField(id, field, value){
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;
  pushUndo();
  const prevStatus = lead.status;
  lead[field] = (field === 'value') ? (Number(value) || 0) : value;
  lead.updatedAt = new Date().toISOString();
  let closedNow = false;
  let reopenedNow = false;
  if (field === 'status' && value === 'Închis' && prevStatus !== 'Închis') {
    closedNow = true;
    logActivity('lead_closed', lead.name + ' — lead închis (' + formatEUR(lead.value) + ')', lead.value);
    state.goal.clients = (Number(state.goal.clients) || 0) + 1;
    saveKey('goal', state.goal);
    addXP(500); vibrate([20,50,20]);
    // Automation rule: onboarding task + collaboration start date
    if (!lead.startDate) lead.startDate = todayISO();
    const cat = state.checklist.categories.sales ? 'sales' : Object.keys(state.checklist.categories)[0];
    if (cat) {
      state.checklist.categories[cat].tasks.push({ id: uid(), label: 'Trimite onboarding, chestionar inițial & invitație Everfit — ' + lead.name });

async function manualRetryDataLoad(){
  if (dataLoadRetryInProgress) return;
  dataLoadRetryInProgress = true;
  renderDataLoadBanner();
  if (syncOpen) renderOverlay();
  const ok = await retryFailedLoads();
  dataLoadRetryInProgress = false;
  if (ok) { dataLoadWarning = false; toast('Toate datele au fost confirmate ✓'); }
  else { toast('Încă nu s-a putut confirma tot — mai încearcă peste puțin timp', 'error'); }
  render();

function startDataLoadRetryWatcher(){
  let round = 0;
  const iv = setInterval(async () => {
    round++;
    if (!loadFailedKeys.size) { dataLoadWarning = false; render(); clearInterval(iv); return; }
    if (dataLoadRetryInProgress) return;
    dataLoadRetryInProgress = true;
    const ok = await retryFailedLoads();
    dataLoadRetryInProgress = false;
    if (ok) { dataLoadWarning = false; render(); clearInterval(iv); return; }
    if (round >= 5) {
      // After 5 rounds (~1 minute) of a key still failing, it's far more likely
      // to be genuinely absent than transiently unreachable — stop auto-retrying
      // so we don't hammer forever, but keep it available for a manual retry
      // from the Sync panel at any time.
      dataLoadWarning = false;
      render();
      clearInterval(iv);
    }
  }, 12000);
}

function hexToRgb(hex){
  const m = hex.replace('#','');
  return [parseInt(m.slice(0,2),16), parseInt(m.slice(2,4),16), parseInt(m.slice(4,6),16)];
}
function applyTabAccent(tab){
  const color = TAB_ACCENTS[tab] || '#F26B1F';
  const [r,g,b] = hexToRgb(color);
  const root = document.documentElement.style;
  root.setProperty('--accent', color);
  root.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+',.14)');
  root.setProperty('--accent-border', 'rgba('+r+','+g+','+b+',.32)');
}

   RENDER: CHECKLIST
========================================================= */
function renderChecklist(){
  const cs = computeChecklistStats();
  const catHtml = Object.keys(state.checklist.categories).map(cat => {
    const catData = state.checklist.categories[cat];
    const tasks = catData.tasks || [];
    const done = tasks.filter(t => state.checklist.checked[t.id]).length;
    const catEditing = editCategory === cat;

    const header = catEditing
      ? '<div class="flex gap-2 items-center mb-1" style="margin-bottom:10px;">' +
          '<input id="edit-category-input" type="text" value="'+escapeAttr(catData.label)+'" class="flex-1 text-base" style="font-weight:700;" />' +
          '<button data-action="save-category" data-cat="'+cat+'" class="icon-btn ok">'+icon('check','icon-sm')+'</button>' +
          '<button data-action="cancel-category" class="icon-btn">'+icon('x','icon-sm')+'</button>' +
        '</div>'
      : '<div class="flex items-center justify-between mb-1" style="margin-bottom:5px;">' +
          '<div class="flex items-center gap-2">' +
            '<h3 class="h2">'+escapeHtml(catData.label)+'</h3>' +
            '<button data-action="edit-category" data-cat="'+cat+'" class="icon-btn" style="padding:3px;">'+icon('edit','icon-sm')+'</button>' +
          '</div>' +
          '<span class="text-xs mute2 tabular">'+done+'/'+tasks.length+'</span>' +
        '</div>';

    const taskRow = (t) => {
      const checked = !!state.checklist.checked[t.id];
      const isEditing = editTask === (cat + ':' + t.id);
      if (isEditing) {
        return '<div class="task-row">' +
          '<input id="edit-task-input" type="text" value="'+escapeAttr(t.label)+'" class="flex-1" />' +
          '<div class="row-actions">' +
            '<button data-action="save-task" data-cat="'+cat+'" data-id="'+t.id+'" class="icon-btn ok">'+icon('check','icon-sm')+'</button>' +
            '<button data-action="cancel-task" class="icon-btn">'+icon('x','icon-sm')+'</button>' +
          '</div>' +
        '</div>';
      }
      return '<div class="task-row">' +
        '<button data-action="toggle-task" data-cat="'+cat+'" data-id="'+t.id+'" class="checkbox'+(checked?' checked':'')+'">' +
          (checked ? icon('check','icon-sm').replace('stroke="currentColor"','stroke="#0A0A0A"') : '') +
        '</button>' +
        '<span class="task-label'+(checked?' done':'')+'">'+escapeHtml(t.label)+'</span>' +
        '<div class="row-actions">' +
          '<button data-action="edit-task" data-cat="'+cat+'" data-id="'+t.id+'" class="icon-btn">'+icon('edit','icon-sm')+'</button>' +
          '<button data-action="remove-task" data-cat="'+cat+'" data-id="'+t.id+'" class="icon-btn danger">'+icon('trash','icon-sm')+'</button>' +
        '</div>' +
      '</div>';
    };

    return '<div class="card">' +
      header +
      '<div class="progress-track-xs mt-2"><div class="progress-fill" style="width:'+(tasks.length ? (done/tasks.length*100) : 0)+'%"></div></div>' +
      '<div>' + tasks.map(taskRow).join('') + '</div>' +
      '<div class="flex gap-2 mt-3">' +
        '<input id="new-task-input-'+cat+'" type="text" placeholder="Adaugă o sarcină nouă…" class="flex-1" />' +
        '<button data-action="add-task" data-cat="'+cat+'" class="btn btn-icon shrink-0">'+icon('plus','icon-sm')+'</button>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('content').innerHTML =
  '<div class="animate-fade flex-col gap-5" style="display:flex;">' +
    '<div class="flex items-center justify-between flex-wrap gap-3">' +
      '<div>' +
        '<h2 class="h1">Execuție Zilnică</h2>' +
        '<p class="text-sm mute2 mt-1">Disciplina de azi: <strong style="color:var(--text); font-weight:600;" class="tabular">'+cs.pct+'%</strong> ('+cs.done+'/'+cs.total+')</p>' +
      '</div>' +
      '<button data-action="reset-day" class="btn">'+icon('refresh','icon-sm')+'Reset Zilnic</button>' +
    '</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:'+cs.pct+'%"></div></div>' +
    '<div class="grid grid-1-3">' + catHtml + '</div>' +
  '</div>';
}

      '<select data-daytype="'+iso+'" class="mb-1" style="font-size:11px; margin-bottom:6px; color:'+(dayType ? (contentTypeStage(dayType)||{}).color || 'var(--accent)' : 'var(--text-faint)')+';">' +

          '<optgroup label="'+grp.stage+'">' +

function computeReferralCounts(){
  const counts = {};
  state.leads.forEach(l => { if (l.referredBy && l.referredBy.trim()) counts[l.referredBy.trim()] = (counts[l.referredBy.trim()]||0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}
