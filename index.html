function saveLeadTags(id){
  const input = document.getElementById('edit-lead-tags-input');
  if (!input) return;
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;
  pushUndo();
  lead.tags = input.value.split(',').map(t => t.trim()).filter(Boolean);
  lead.updatedAt = new Date().toISOString();
  editLeadTags = null;
  saveKey('leads', state.leads);
  render();
}
function renderCRM(){
  const t = todayISO();
  const viewLeads = state.leads.filter(l => crmView === 'archived' ? l.archived : !l.archived);
  let leads = viewLeads.slice().sort((a,b) => (a.followup||'9999').localeCompare(b.followup||'9999'));
  if (urgentOnly) leads = leads.filter(l => l.followup && l.followup <= t);
  if (clientStageFilter === 'prospect') leads = leads.filter(l => !isActiveClient(l));
  else if (clientStageFilter === 'client') leads = leads.filter(l => isActiveClient(l));
  if (leadTagFilter.length) leads = leads.filter(l => (l.tags||[]).some(tag => leadTagFilter.includes(tag)));
  if (leadSearch.trim()) {
    const q = normalize(leadSearch);
    leads = leads.filter(l => normalize(l.name).includes(q));
  }

  const allTags = Array.from(new Set(state.leads.flatMap(l => l.tags||[]))).sort();
  const archivedCount = state.leads.filter(l => l.archived).length;
  const activeValue = state.leads.filter(l => !isActiveClient(l) && !l.archived).reduce((s,l) => s + (Number(l.value)||0), 0);
  const closedCount = state.leads.filter(l => l.status === 'Închis' && !l.archived).length;
  const urgentCount = computeUrgentLeads().length;
  const outstanding = computeOutstandingBalance();
  const statOptions = LEAD_STATUSES.map(s => '<option value="'+s+'">'+s+'</option>').join('');
  const referrals = computeReferralCounts();

  const tagsBlock = (l) => {
    if (editLeadTags === l.id) {
      return '<div class="flex gap-1 mt-1" style="margin-top:4px;">' +
        '<input id="edit-lead-tags-input" type="text" value="'+escapeAttr((l.tags||[]).join(', '))+'" placeholder="tag1, tag2…" style="font-size:11px; padding:4px 8px;" />' +
        '<button data-action="save-lead-tags" data-id="'+l.id+'" class="icon-btn ok" style="padding:3px;">'+icon('check','icon-sm')+'</button>' +
        '<button data-action="cancel-lead-tags" class="icon-btn" style="padding:3px;">'+icon('x','icon-sm')+'</button>' +
      '</div>';

    return '<div class="flex flex-wrap gap-1 mt-1" data-action="edit-lead-tags" data-id="'+l.id+'" style="margin-top:4px; cursor:pointer; min-height:16px;">' +
      ((l.tags&&l.tags.length) ? l.tags.map(tag => '<span class="badge" style="font-size:10px; padding:2px 7px;">#'+escapeHtml(tag)+'</span>').join('') : '<span class="text-xs mute3 italic" style="font-size:10.5px;">+ taguri</span>') +
    '</div>';
  };

  const row = (l) => {
    const isUrgent = !l.archived && l.followup && l.followup <= t;
    const paid = Number(l.paid) || 0;
    const value = Number(l.value) || 0;
    const balance = value - paid;
    const score = computeLeadScore(l);
    let balanceHtml = '';
    if (value > 0) {
      if (balance <= 0) balanceHtml = '<div class="text-xs good-text mt-1" style="margin-top:2px;">Achitat ✓</div>';
      else if (paid > 0) balanceHtml = '<div class="text-xs bad-text mt-1" style="margin-top:2px;">Rest: '+formatEUR(balance)+'</div>';
    }
    return '<tr'+(isUrgent?' class="urgent-row"':'')+'>' +
      '<td style="min-width:140px;"><div class="flex items-center gap-2">' +
        '<button data-action="open-qualify" data-id="'+l.id+'" class="badge" style="color:'+scoreColor(score)+'; border-color:'+scoreColor(score)+'44; flex-shrink:0;" title="Scor de calificare — click pentru detalii">'+icon('target','icon-sm')+' '+score+'</button>' +
        '<input data-field="lead-name" data-id="'+l.id+'" value="'+escapeAttr(l.name)+'" class="field-plain text-sm" />' +
      '</div>' + tagsBlock(l) + '</td>' +
      '<td><select data-field="lead-status" data-id="'+l.id+'" style="font-size:12px;color:'+(LEAD_STATUS_COLORS[l.status]||'#fff')+';">' +
          LEAD_STATUSES.map(s => '<option value="'+s+'" '+(s===l.status?'selected':'')+'>'+s+'</option>').join('') +
        '</select></td>' +
      '<td class="tabular"><input data-field="lead-value" data-id="'+l.id+'" type="number" min="0" value="'+(l.value||0)+'" class="field-plain text-sm" style="width:70px;" />' + balanceHtml + '</td>' +
      '<td>' +
        '<input data-field="lead-followup" data-id="'+l.id+'" type="date" value="'+(l.followup||'')+'" style="font-size:12px; color:'+(isUrgent?'#fca5a5':'rgba(245,245,240,.7)')+';" />' +
        '<div class="flex gap-1 mt-1" style="margin-top:4px;">' +
          '<button data-action="quick-followup" data-id="'+l.id+'" data-days="3" class="badge" style="font-size:10px; padding:2px 7px;">+3z</button>' +
          '<button data-action="quick-followup" data-id="'+l.id+'" data-days="7" class="badge" style="font-size:10px; padding:2px 7px;">+7z</button>' +
        '</div>' +
      '</td>' +
      '<td><select data-field="lead-source" data-id="'+l.id+'" style="font-size:12px; color:rgba(245,245,240,.6);">' +
          '<option value="DM" '+(l.source==='DM'?'selected':'')+'>DM</option>' +
          '<option value="Formular" '+(l.source==='Formular'?'selected':'')+'>Formular</option>' +
        '</select></td>' +
      '<td class="text-right"><div class="row-actions" style="justify-content:flex-end; flex-wrap:wrap;">' +
        '<button data-action="open-instagram-dm" data-id="'+l.id+'" class="icon-btn'+(l.igLink?'':' mute3')+'" aria-label="Mesaj" title="'+(l.igLink?'Deschide conversația pe Instagram':'Adaugă linkul conversației de Instagram')+'">'+icon('send','icon-sm')+'</button>' +
        '<button data-action="open-payments" data-id="'+l.id+'" class="icon-btn" aria-label="Plăți" title="Plăți">'+icon('wallet','icon-sm')+'</button>' +
        '<button data-action="open-client-summary" data-id="'+l.id+'" class="icon-btn" aria-label="Fișă client" title="Exportă fișă client">'+icon('external','icon-sm')+'</button>' +
        '<button data-action="duplicate-lead" data-id="'+l.id+'" class="icon-btn" aria-label="Duplică" title="Duplică lead">'+icon('copy','icon-sm')+'</button>' +
        '<button data-action="toggle-archive-lead" data-id="'+l.id+'" class="icon-btn" aria-label="Arhivează" title="'+(crmView==='archived'?'Restaurează':'Arhivează')+'">'+icon('bookmark','icon-sm')+'</button>' +
        '<button data-action="delete-lead" data-id="'+l.id+'" class="icon-btn danger" aria-label="Șterge lead" title="Șterge">'+icon('trash','icon-sm')+'</button>' +
      '</div></td>' +
    '</tr>';
  };

  const leadCard = (l) => {
    const isUrgent = !l.archived && l.followup && l.followup <= t;
    const paid = Number(l.paid) || 0;
    const value = Number(l.value) || 0;
    const balance = value - paid;
    const score = computeLeadScore(l);
    const renewal = computeRenewalStatus(l);
    let balanceHtml = '';
    if (value > 0) {
      if (balance <= 0) balanceHtml = '<span class="badge badge-good">Achitat ✓</span>';
      else if (paid > 0) balanceHtml = '<span class="badge badge-danger">Rest: '+formatEUR(balance)+'</span>';
    }
    return '<div class="lead-card'+(isUrgent?' urgent':'')+'" data-lead-id="'+l.id+'">' +
      (isUrgent ? '<div style="background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:8px; padding:6px 10px; margin-bottom:10px;">' +
          '<span class="text-xs" style="font-weight:700; color:#fca5a5;">📌 '+(l.followupReason?escapeHtml(l.followupReason):(l.followup===t?'Follow-up azi':'Follow-up depășit — '+formatDateRO(l.followup)))+'</span>' +
          (l.followupDescription ? '<p class="text-xs mute2" style="margin-top:2px;">'+escapeHtml(l.followupDescription)+'</p>' : '') +
        '</div>' : '') +
      (renewal ? '<div class="flex items-center justify-between gap-2" style="background:'+(renewal.level==='danger'?'rgba(239,68,68,.14)':'rgba(251,191,36,.14)')+'; border:1px solid '+(renewal.level==='danger'?'rgba(239,68,68,.35)':'rgba(251,191,36,.35)')+'; border-radius:8px; padding:6px 10px; margin-bottom:10px;">' +
          '<span class="text-xs" style="font-weight:700; color:'+(renewal.level==='danger'?'#fca5a5':'#FBBF24')+';">⏰ Pachet expiră în '+renewal.daysUntil+' zile</span>' +
          '<button data-action="initiate-renewal" data-id="'+l.id+'" class="btn btn-sm" style="padding:4px 10px; font-size:11px;">Reînnoiește</button>' +
        '</div>' : '') +
      '<div class="flex items-start justify-between gap-2">' +
        '<input data-field="lead-name" data-id="'+l.id+'" value="'+escapeAttr(l.name)+'" class="field-plain" style="font-weight:600; font-size:15px;" />' +
        '<div class="row-actions shrink-0">' +
          '<button data-action="open-instagram-dm" data-id="'+l.id+'" class="icon-btn'+(l.igLink?'':' mute3')+'" aria-label="Mesaj" title="'+(l.igLink?'Deschide conversația pe Instagram':'Adaugă linkul conversației de Instagram')+'">'+icon('send','icon-sm')+'</button>' +
          '<button data-action="open-payments" data-id="'+l.id+'" class="icon-btn" aria-label="Plăți" title="Înregistrează sau vezi istoricul plăților pentru acest lead">'+icon('wallet','icon-sm')+'</button>' +
          '<button data-action="open-client-summary" data-id="'+l.id+'" class="icon-btn" aria-label="Fișă client" title="Deschide rezumatul complet — istoric, plăți, milestone-uri">'+icon('external','icon-sm')+'</button>' +
          '<button data-action="delete-lead" data-id="'+l.id+'" class="icon-btn danger" aria-label="Șterge">'+icon('trash','icon-sm')+'</button>' +
        '</div>' +
      '</div>' +
      tagsBlock(l) +
      '<button data-action="open-qualify" data-id="'+l.id+'" class="badge mt-2" style="color:'+scoreColor(score)+'; border-color:'+scoreColor(score)+'44;">'+icon('target','icon-sm')+' Scor calificare: '+score+'</button>' +
      '<div class="status-pill-row mt-3" style="margin-top:10px;">' +
        LEAD_STATUSES.map(s => {
          const active = s === l.status;
          const c = LEAD_STATUS_COLORS[s];
          return '<button data-action="set-lead-status" data-id="'+l.id+'" data-status="'+s+'" class="status-pill'+(active?' active':'')+'"'+(active?' style="background:'+c+';"':'')+'>'+s+'</button>';
        }).join('') +
      '</div>' +
      '<div class="grid" style="grid-template-columns:1fr 1fr; margin-top:10px;">' +
        '<div><label class="field-label">Valoare €</label><input data-field="lead-value" data-id="'+l.id+'" type="number" min="0" value="'+(l.value||0)+'" class="tabular" /></div>' +
        '<div><label class="field-label">Follow-up</label><input data-field="lead-followup" data-id="'+l.id+'" type="date" value="'+(l.followup||'')+'" style="'+(isUrgent?'color:#fca5a5;':'')+'" /></div>' +
      '</div>' +
      '<div class="flex gap-2 mt-2">' +
        '<button data-action="quick-followup" data-id="'+l.id+'" data-days="3" class="btn btn-sm">+3 zile</button>' +
        '<button data-action="quick-followup" data-id="'+l.id+'" data-days="7" class="btn btn-sm">+7 zile</button>' +
        '<button data-action="duplicate-lead" data-id="'+l.id+'" class="btn btn-sm">'+icon('copy','icon-sm')+'Duplică</button>' +
      '</div>' +
      (balanceHtml ? '<div class="mt-2">'+balanceHtml+'</div>' : '') +
      '<div class="flex gap-2 mt-2">' +
        '<select data-field="lead-followupReason" data-id="'+l.id+'" style="font-size:12px;" title="Motiv follow-up">' +
          '<option value="">Motiv follow-up — nesetat</option>' +
          FOLLOWUP_REASONS.map(r => '<option value="'+escapeAttr(r)+'" '+(l.followupReason===r?'selected':'')+'>'+escapeHtml(r)+'</option>').join('') +
        '</select>' +
        '<button data-action="toggle-archive-lead" data-id="'+l.id+'" class="btn btn-sm shrink-0">'+icon('bookmark','icon-sm')+(crmView==='archived'?'Restaurează':'Arhivează')+'</button>' +
      '</div>' +
    '</div>';
  };

  document.getElementById('content').innerHTML =
  '<div class="animate-fade flex-col gap-5" style="display:flex;">' +
    '<div class="flex items-center justify-between flex-wrap gap-3">' +
      '<h2 class="h1">CRM Lead Tracker</h2>' +
      '<div class="flex flex-wrap gap-2">' +
        '<button data-action="toggle-crm-view" class="btn'+(crmView==='archived'?' btn-active':'')+'">'+icon('bookmark','icon-sm')+(crmView==='archived'?'Vezi active':'Arhivă / Pierdute')+(archivedCount?' <span class="tabular">('+archivedCount+')</span>':'')+'</button>' +
        '<button data-action="toggle-urgent" class="btn'+(urgentOnly?' btn-active':'')+'">Necesită atenție azi'+(urgentCount?' <span class="tabular">('+urgentCount+')</span>':'')+'</button>' +
        '<button data-action="set-stage-filter" data-stage="prospect" class="btn'+(clientStageFilter==='prospect'?' btn-active':'')+'" title="Lead-uri care încă n-au fost închise sau reînnoite">Neînchiși</button>' +
        '<button data-action="set-stage-filter" data-stage="client" class="btn'+(clientStageFilter==='client'?' btn-active':'')+'" title="Clienți cu status Închis sau Retain">Închiși / Reînnoiți</button>' +
      '</div>' +
    '</div>' +

    '<div class="grid grid-2-4">' +
      '<div class="chip"><p class="eyebrow" style="margin-bottom:6px;">Lead-uri active</p><p class="num-lg tabular">'+viewLeads.length+'</p></div>' +
      '<div class="chip"><p class="eyebrow" style="margin-bottom:6px;">Valoare pipeline activ</p><p class="num-lg tabular">'+formatEUR(activeValue)+'</p></div>' +
      '<div class="chip"><p class="eyebrow" style="margin-bottom:6px;">Închise</p><p class="num-lg tabular">'+closedCount+'</p></div>' +
      '<div class="chip"><p class="eyebrow" style="margin-bottom:6px;">Rest de încasat</p><p class="num-lg tabular" style="'+(outstanding>0?'color:#fca5a5;':'')+'">'+formatEUR(outstanding)+'</p></div>' +
    '</div>' +

    (crmView === 'active' ? (
      addLeadFormOpen
        ? '<div class="card">' +
            '<div class="flex items-center justify-between" style="margin-bottom:10px;">' +
              '<p class="eyebrow" style="margin:0;">Adaugă lead nou</p>' +
              '<button data-action="toggle-add-lead-form" class="icon-btn" aria-label="Închide">'+icon('x','icon-sm')+'</button>' +
            '</div>' +
            '<div class="flex flex-wrap gap-2">' +
              '<input id="new-lead-name" type="text" placeholder="Nume" class="flex-1" style="min-width:140px;" />' +
              '<select id="new-lead-status">'+statOptions+'</select>' +
              '<input id="new-lead-value" type="number" min="0" placeholder="Valoare €" style="width:110px;" />' +
              '<input id="new-lead-followup" type="date" style="color:rgba(245,245,240,.7);" />' +
              '<select id="new-lead-source"><option value="DM">DM</option><option value="Formular">Formular</option></select>' +
              '<button data-action="add-lead" class="btn btn-primary">'+icon('plus','icon-sm')+'Adaugă</button>' +
            '</div>' +
          '</div>'
        : '<button data-action="toggle-add-lead-form" class="btn btn-primary w-full" style="justify-content:center;">'+icon('plus','icon-sm')+'Adaugă lead nou</button>'
    ) : '') +

    (referrals.length ? (
      '<div class="card">' +
        '<p class="eyebrow" style="margin-bottom:10px;">Recomandări — clienți care au adus alți clienți</p>' +
        '<div class="flex-col gap-2" style="display:flex;">' +
          referrals.map(([name,count]) => (
            '<div class="flex items-center justify-between">' +
              '<span class="text-sm muted">'+escapeHtml(name)+'</span>' +
              '<span class="badge'+(count>=2?' badge-good':'')+'">'+count+' recomandăr'+(count===1?'e':'i')+(count>=2?' — merită bonus 🎁':'')+'</span>' +
            '</div>'
          )).join('') +
        '</div>' +
      '</div>'
    ) : '') +

    (allTags.length ? (
      '<div class="flex flex-wrap gap-2">' +
        allTags.map(tag => '<button data-action="toggle-lead-tag-filter" data-tag="'+escapeAttr(tag)+'" class="status-pill'+(leadTagFilter.includes(tag)?' active':'')+'"'+(leadTagFilter.includes(tag)?' style="background:var(--accent);"':'')+'">#'+escapeHtml(tag)+'</button>').join('') +
      '</div>'
    ) : '') +

    '<div class="flex gap-2 items-center">' +
      icon('search','icon-sm') +
      '<input id="lead-search-input" type="text" placeholder="Caută după nume…" value="'+escapeAttr(leadSearch)+'" class="flex-1" />' +
    '</div>' +

    (leads.length ? '' :
      '<div class="card text-center" style="padding:40px 20px;"><p class="text-sm muted">'+(crmView==='archived'?'Nimic în arhivă.':(leadSearch.trim()?'Niciun lead nu corespunde căutării.':'Niciun lead încă.'))+'</p></div>'
    ) +

    '<div class="desktop-table card" style="padding:0;">' +
      (leads.length ? '<div class="table-wrap"><table><thead><tr>' +
        '<th>Nume</th><th>Status</th><th>Valoare</th><th>Follow-up</th><th>Sursă</th><th></th>' +
      '</tr></thead><tbody>' + leads.map(row).join('') + '</tbody></table></div>' : '') +
    '</div>' +

    '<div class="mobile-cards">' +
      '<div class="flex-col gap-3" style="display:flex;">' + leads.map(leadCard).join('') + '</div>' +
    '</div>' +
  '</div>';
  document.querySelectorAll('.lead-card .status-pill.active').forEach(el => {
    el.scrollIntoView({ block: 'nearest', inline: 'start' });
  });
}

/* =========================================================
   RENDER: REPORTS — activity log + period summary
========================================================= */
function renderReports(){
  const items = activityInPeriod(reportPeriod);
  const closedItems = items.filter(a => a.type === 'lead_closed');
  const paymentItems = items.filter(a => a.type === 'payment');
  const postItems = items.filter(a => a.type === 'post');
  const leadItems = items.filter(a => a.type === 'lead_added');
  const closedValue = closedItems.reduce((s,a) => s + (a.amount||0), 0);
  const paymentsValue = paymentItems.reduce((s,a) => s + (a.amount||0), 0);
  const cs = computeChecklistStats();
  const ins = computeInsights();
  const ads = computeAdsMetrics();
  const dmStats = computeDmConversionStats();
  const pl = computeMonthlyPL();
  const forecast = computeRevenueForecast90();

  const TYPE_ICON = { lead_added:'users', lead_closed:'wallet', payment:'wallet', post:'calendar', checklist:'check' };

  const feedHtml = items.length
    ? items.map(a => '<div class="activity-item"><span class="activity-dot"></span><div class="flex-1"><p class="text-sm" style="color:rgba(245,245,240,.85);">'+escapeHtml(a.text)+'</p><p class="text-xs mute3 mt-1" style="margin-top:2px;">'+formatTimeShort(a.ts)+'</p></div></div>').join('')
    : '<p class="text-sm mute3 italic" style="padding:20px 0;">Nicio activitate înregistrată în această perioadă.</p>';

  const funnelHtml = LEAD_STATUSES.map(s => {
    const count = ins.statusCounts[s] || 0;
    const pct = ins.total ? Math.round(count/ins.total*100) : 0;
    return '<div>' +
      '<div class="flex justify-between text-xs mute2" style="margin-bottom:3px;"><span>'+s+'</span><span class="tabular">'+count+'</span></div>' +
      '<div class="progress-track-sm"><div class="progress-fill" style="width:'+pct+'%; background:'+(LEAD_STATUS_COLORS[s]||'var(--accent)')+';"></div></div>' +
    '</div>';
  }).join('');

  const pillarHtml = Object.keys(PILLARS).map(k => {
    const c = ins.pillarCounts[k];
    const pct = Math.round(c.total/ins.maxPillarTotal*100);
    return '<div>' +
      '<div class="flex justify-between text-xs mute2" style="margin-bottom:3px;"><span>'+PILLARS[k].label+'</span><span class="tabular">'+c.postat+'/'+c.total+' postate</span></div>' +
      '<div class="progress-track-sm"><div class="progress-fill" style="width:'+pct+'%; background:'+PILLARS[k].color+';"></div></div>' +
    '</div>';
  }).join('');

  document.getElementById('content').innerHTML =
  '<div class="animate-fade flex-col gap-5" style="display:flex;">' +
    '<h2 class="h1">Rapoarte</h2>' +

    '<div class="grid grid-1-2">' +
      '<div class="card">' +
        '<p class="eyebrow" style="margin-bottom:12px;">Pipeline — toate lead-urile ('+ins.total+')</p>' +
        '<div class="flex-col gap-3" style="display:flex;">' + (ins.total ? funnelHtml : '<p class="text-xs mute3 italic">Niciun lead încă.</p>') + '</div>' +
        '<div class="grid grid-2-3 mt-4">' +
          '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">Rată conversie</p><p class="num-lg tabular">'+ins.conversionRate+'%</p></div>' +
          '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">Deal mediu</p><p class="num-lg tabular">'+formatEUR(ins.avgDeal)+'</p></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="eyebrow" style="margin-bottom:12px;">Conținut pe piloni (all-time)</p>' +
        '<div class="flex-col gap-3" style="display:flex;">' + pillarHtml + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="flex items-center justify-between" style="margin-bottom:12px;">' +
        '<p class="eyebrow" style="margin:0;">Ad-uri & Retenție</p>' +
      '</div>' +
      '<div class="grid grid-2-4">' +
        '<div class="chip">' +
          '<p class="eyebrow" style="margin-bottom:4px;">Buget lunar ad-uri (€)</p>' +
          '<input data-field="ads-budget" type="number" min="0" value="'+(state.ads.monthlyBudget||'')+'" placeholder="0" class="field-plain num-lg tabular" />' +
        '</div>' +
        '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">Cost / Lead (luna asta)</p><p class="num-lg tabular">'+(ads.cpl!==null?formatEUR(ads.cpl):'—')+'</p></div>' +
        '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">Cost / Achiziție (luna asta)</p><p class="num-lg tabular">'+(ads.cac!==null?formatEUR(ads.cac):'—')+'</p></div>' +
        '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">LTV mediu</p><p class="num-lg tabular">'+formatEUR(computeLTV())+'</p></div>' +
        '<div class="chip"><p class="eyebrow" style="margin-bottom:4px;">Conversii DM azi / săpt.</p><p class="num-lg tabular">'+dmStats.today+' / '+dmStats.week+'</p></div>' +
      '</div>' +
      '<div class="grid grid-2-4 mt-3" style="margin-top:12px;">' +
        '<div class="chip" style="grid-column: span 2;">' +
          '<p class="eyebrow" style="margin-bottom:4px;">ROAS (luna asta)</p>' +
          '<p class="num-lg tabular" style="'+(ads.roas!==null && ads.roas>=100?'color:#34D399;':ads.roas!==null?'color:#f87171;':'')+'">'+(ads.roas!==null?ads.roas.toFixed(0)+'%':'—')+'</p>' +
          '<p class="text-xs mute3 mt-1" style="margin-top:2px;">Venit din lead-uri închise ('+formatEUR(ads.revenue)+') / buget ad-uri × 100</p>' +
        '</div>' +
      '</div>' +
      '<p class="text-xs mute3 mt-3" style="margin-top:12px;">CPL, CAC și ROAS calculate din activitatea lunii curente, raportate la bugetul introdus.</p>' +
    '</div>' +

    '<div class="card" style="border-top:3px solid #34D399;">' +

function parseContentLink(url){
  // Try a real inline preview first (works in normal browsers, incl. the
  // public artifact link). Some in-app WebViews block third-party embed
  // iframes outright, so a working "open" button is always shown as well —
  // never only the embed — in case it renders blank in a stricter context.
  let m = url.match(/instagram\.com\/(p|reel|reels)\/([A-Za-z0-9_-]+)/i);
  if (m) return { platform: 'instagram', embedUrl: 'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed/' };
  m = url.match(/tiktok\.com\/@[\w.\-]+\/video\/(\d+)/i);
  if (m) return { platform: 'tiktok', embedUrl: 'https://www.tiktok.com/embed/v2/'+m[1] };
  if (/tiktok\.com/i.test(url)) return { platform: 'tiktok', embedUrl: null };
  if (/instagram\.com/i.test(url)) return { platform: 'instagram', embedUrl: null };
  return { platform: 'other', embedUrl: null };
}
function addContentLink(){
  const input = document.getElementById('new-link-url');
  const tagsInput = document.getElementById('new-link-tags');
  const accountSelect = document.getElementById('new-link-account');
  if (!input || !input.value.trim()) { toast('Lipește un link mai întâi', 'error'); return; }
  const url = input.value.trim();
  const parsed = parseContentLink(url);
  const tags = tagsInput && tagsInput.value.trim() ? tagsInput.value.split(',').map(t => t.trim()).filter(Boolean) : [];
  const sourceAccountId = accountSelect && accountSelect.value ? accountSelect.value : null;
  pushUndo();
  const link = { id: uid(), url, platform: parsed.platform, embedUrl: parsed.embedUrl, tags, hook: '', angle: '', cta: '', addedAt: new Date().toISOString() };
  if (sourceAccountId) link.sourceAccountId = sourceAccountId;
  state.links.unshift(link);
  saveKey('links', state.links);
  render();
  toast('Link salvat');
}
function updateLinkDeconstructField(id, field, value){
  const link = state.links.find(l => l.id === id);
  if (!link) return;
  link[field] = value;
  saveKey('links', state.links);
}
function convertLinkToIdea(id){
  const link = state.links.find(l => l.id === id);
  if (!link) return;
  const parts = [link.hook, link.angle].map(s => (s||'').trim()).filter(Boolean);
  if (!parts.length) { toast('Completează Hook sau Unghi înainte de a converti', 'error'); return; }
  pushUndo();
  state.content.ideas.tehnic = state.content.ideas.tehnic || [];
  const idea = { id: uid(), text: parts[0] };
  if (link.hook) idea.hook = link.hook.trim();
  if (link.angle) idea.angle = link.angle.trim();
  if (link.cta) idea.cta = link.cta.trim();
  state.content.ideas.tehnic.unshift(idea);
  saveKey('content', state.content);
  toast('Idee proprie creată — sus în banca de idei (Tehnică)');
}
function deleteContentLink(id){
  if (!confirm('Ștergi acest link salvat?')) return;
  pushUndo();
  state.links = state.links.filter(l => l.id !== id);
  saveKey('links', state.links);
  render();
}

   MUTATIONS — tracked Instagram accounts (Inspirație)

function normalizeInstagramAccountInput(raw){
  raw = (raw || '').trim();
  if (/^https?:\/\//i.test(raw)) {
    const m = raw.match(/instagram\.com\/([^/?#]+)/i);
    return { handle: m ? '@'+m[1] : raw, url: raw };
  }
  const clean = raw.replace(/^@/, '').replace(/\/$/, '').trim();
  return { handle: '@'+clean, url: 'https://instagram.com/'+clean };
}
function addTrackedAccount(){
  const input = document.getElementById('new-account-handle');
  const catsInput = document.getElementById('new-account-categories');
  if (!input || !input.value.trim()) { toast('Adaugă mai întâi un @handle sau un link de Instagram', 'error'); return; }
  const { handle, url } = normalizeInstagramAccountInput(input.value);
  if (state.trackedAccounts.some(a => a.handle.toLowerCase() === handle.toLowerCase())) {
    toast('Ai deja contul ăsta în listă', 'error');
    return;
  }
  const categories = catsInput && catsInput.value.trim() ? catsInput.value.split(',').map(t => t.trim()).filter(Boolean) : [];
  pushUndo();
  state.trackedAccounts.unshift({ id: uid(), handle, url, categories, note: '', addedAt: new Date().toISOString(), lastCheckedAt: null });
  saveKey('trackedAccounts', state.trackedAccounts);
  render();
  toast('Cont adăugat');
}

}

let pendingTestimonialMedia = [];
function handleTestimonialMediaSelect(input){
  const files = Array.from(input.files || []);
  input.value = '';
  files.forEach(file => {
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/');
    if (!isImage && !isVideo) { toast(file.name + ' nu e poză sau video', 'error'); return; }
    const maxBytes = isVideo ? 10*1024*1024 : 3*1024*1024;
    if (file.size > maxBytes) { toast(file.name + ' e prea mare (max ' + (isVideo?'10MB video':'3MB poză') + ')', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingTestimonialMedia.push({ id: uid(), type: isVideo ? 'video' : 'image', name: file.name, dataUrl: reader.result });
      renderTestimonials();
    };
    reader.onerror = () => toast('Nu am putut citi ' + file.name, 'error');
    reader.readAsDataURL(file);
  });
}
function removePendingTestimonialMedia(mediaId){
  pendingTestimonialMedia = pendingTestimonialMedia.filter(m => m.id !== mediaId);
  renderTestimonials();
}
function handleExistingTestimonialMediaSelect(id, input){
  const t = state.testimonials.find(x => x.id === id);
  if (!t) return;
  const files = Array.from(input.files || []);
  input.value = '';
  files.forEach(file => {
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/');
    if (!isImage && !isVideo) { toast(file.name + ' nu e poză sau video', 'error'); return; }
    const maxBytes = isVideo ? 10*1024*1024 : 3*1024*1024;
    if (file.size > maxBytes) { toast(file.name + ' e prea mare (max ' + (isVideo?'10MB video':'3MB poză') + ')', 'error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pushUndo();
      t.media = t.media || [];
      t.media.push({ id: uid(), type: isVideo ? 'video' : 'image', name: file.name, dataUrl: reader.result });
      saveKey('testimonials', state.testimonials);

    };
    reader.onerror = () => toast('Nu am putut citi ' + file.name, 'error');
    reader.readAsDataURL(file);
  });
}

function toggleDiscoveryStep(leadId, step){
  const lead = state.leads.find(l => l.id === leadId);
  if (!lead) return;
  lead.discoveryChecklist = lead.discoveryChecklist || {};
  lead.discoveryChecklist[step] = !lead.discoveryChecklist[step];
  lead.updatedAt = new Date().toISOString();
  saveKey('leads', state.leads);
  renderQuickDesk();
}

  if (!confirm('Marchezi "'+lead.name+'" ca închis/convertit? Se adaugă +1 la clienți activi și MRR se actualizează.')) return;
  updateLeadField(quickDeskLeadId, 'status', 'Închis');
}

function updateCallNotes(leadId, text){
  const lead = state.leads.find(l => l.id === leadId);

  saveKey('leads', state.leads);
}

let lastOverlayScrollTop = 0;
let longPressTimer = null;
let longPressTarget = null;
function onTooltipTouchStart(e){
  const el = e.target.closest('[title]');
  if (!el) return;
  longPressTarget = el;
  longPressTimer = setTimeout(() => {
    const text = el.getAttribute('title');
    if (text) { toast(text); vibrate(10); }
    longPressTimer = null;
  }, 500);
}
function onTooltipTouchMove(){
  // Any real movement means it's a scroll or swipe, not a long-press for
  // an explanation — cancel so we don't pop a tooltip after the gesture.
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}
function onTooltipTouchEnd(){
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  longPressTarget = null;
}
function trackOverlayScroll(e){
  const body = e.target.closest ? e.target.closest('.overlay-body') : null;
  if (body) lastOverlayScrollTop = body.scrollTop;
}
function renderOverlay(){
  const root = document.getElementById('overlay-root');
  // Read from the continuously-tracked value, not a live scrollTop check —
  // clicking a button near the bottom of a scroll container can make the
  // browser natively auto-scroll it into view BEFORE our own click handler
  // even runs, so a live read here can already be corrupted by that native
  // jump. The tracked value reflects where the person was actually reading
  // a moment ago, which is what should be restored.
  const prevScroll = lastOverlayScrollTop;
  if (notesOpen) { root.innerHTML = notesOverlayHtml(); }
  else if (paymentsOpenFor) { root.innerHTML = paymentsOverlayHtml(paymentsOpenFor); }
  else if (qualifyOpenFor) { root.innerHTML = qualifyOverlayHtml(qualifyOpenFor); }
  else if (clientSummaryFor) { root.innerHTML = clientSummaryOverlayHtml(clientSummaryFor); }
  else if (outreachPickerFor) { root.innerHTML = outreachPickerOverlayHtml(outreachPickerFor); }
  else if (ctaPickerOpen) { root.innerHTML = ctaPickerOverlayHtml(); }
  else if (postDetailFor) { root.innerHTML = postDetailOverlayHtml(postDetailFor); }
  else if (snippetOpenFor) { root.innerHTML = snippetOverlayHtml(); }
  else if (syncOpen) { root.innerHTML = syncOverlayHtml(); }
  else { root.innerHTML = ''; lastOverlayScrollTop = 0; return; }
  const newBody = root.querySelector('.overlay-body');
  if (newBody && prevScroll) newBody.scrollTop = prevScroll;
}

function formatBackupStatus(){
  if (!appMeta.lastBackupAt) return { text: 'Niciodată', stale: true };
  const then = new Date(appMeta.lastBackupAt);
  const days = Math.floor((Date.now() - then.getTime()) / (24*60*60*1000));
  const stale = days >= 7;
  let text;
  if (days <= 0) text = 'astăzi';
  else if (days === 1) text = 'ieri';
  else text = 'acum ' + days + ' zile';
  return { text, stale };
}

function preserveCursor(inputId, renderFn){
  const el = document.getElementById(inputId);
  const pos = el ? el.selectionStart : null;
  renderFn();
  const el2 = document.getElementById(inputId);
  if (el2 && pos !== null) { el2.focus(); el2.setSelectionRange(pos, pos); }
}

function anyOverlayOpen(){
  return !!(notesOpen || paymentsOpenFor || qualifyOpenFor || clientSummaryFor || outreachPickerFor || postDetailFor || snippetOpenFor || syncOpen || filmingMode || fabMenuOpen || leadQuickMenuFor || ctaPickerOpen);
}
function onGlobalKeydown(e){
  if (e.key === 'Escape') {
    if (notesOpen) { closeNotes(); return; }
    if (paymentsOpenFor) { closePayments(); return; }
    if (qualifyOpenFor) { closeQualify(); return; }
    if (clientSummaryFor) { clientSummaryFor = null; renderOverlay(); return; }
    if (outreachPickerFor) { closeOutreachPicker(); return; }
    if (postDetailFor) { closePostDetail(); return; }
    if (snippetOpenFor) { closeSnippet(); return; }
    if (syncOpen) { closeSync(); return; }
    if (filmingMode) { closeFilmingMode(); return; }
    if (fabMenuOpen) { closeFabMenu(); return; }
    if (leadQuickMenuFor) { closeLeadQuickMenu(); return; }
    return;
  }
  if (!e.altKey) return;
  if (anyOverlayOpen()) return; // don't switch tabs behind an open overlay — avoids duplicate-id / stale-state conflicts
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); openNotes(); }
  else if (k === 'c') { e.preventDefault(); switchTab('crm'); }
  else if (k === 'd') { e.preventDefault(); switchTab('dashboard'); }
}
let swipeStartX = null, swipeStartY = null, swipeCardEl = null, swipeDeciding = true;
function onSwipeTouchStart(e){
  const card = e.target.closest('.lead-card');
  if (!card || e.target.closest('input,select,textarea,button,a')) { swipeCardEl = null; return; }
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeCardEl = card;
  swipeDeciding = true;
}
function onSwipeTouchMove(e){
  if (!swipeCardEl || swipeStartX === null) return;
  const dx = e.touches[0].clientX - swipeStartX;
  const dy = e.touches[0].clientY - swipeStartY;
  if (swipeDeciding) {
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
    if (Math.abs(dy) > Math.abs(dx)) { swipeCardEl = null; return; } // vertical scroll wins, bail out
    swipeDeciding = false;
  }
  e.preventDefault();
  const clamped = Math.max(-120, Math.min(120, dx));
  swipeCardEl.style.transition = 'none';
  swipeCardEl.style.transform = 'translateX('+clamped+'px)';
  swipeCardEl.style.background = clamped > 0 ? 'rgba(52,211,153,.12)' : clamped < 0 ? 'rgba(251,191,36,.12)' : '';
}
function onSwipeTouchEnd(e){
  if (!swipeCardEl) return;
  const card = swipeCardEl;
  const leadId = card.dataset.leadId;
  const dx = (e.changedTouches[0].clientX - swipeStartX) || 0;
  card.style.transition = 'transform .2s ease, background .2s ease';
  card.style.transform = '';
  card.style.background = '';
  if (!swipeDeciding && Math.abs(dx) > 80 && leadId) {
    if (dx > 0) advanceLeadStatus(leadId); else openLeadQuickMenu(leadId);
  }
  swipeCardEl = null; swipeStartX = null; swipeStartY = null; swipeDeciding = true;
}
function advanceLeadStatus(id){
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;
  const idx = LEAD_STATUSES.indexOf(lead.status);
  if (idx < 0 || idx >= LEAD_STATUSES.length - 1) { toast(lead.name + ' este deja în ultimul stadiu'); return; }
  updateLeadField(id, 'status', LEAD_STATUSES[idx + 1]);
  vibrate(12);
}
function onBeforeUnload(e){
  const pendingCount = Object.keys(pendingSaves).length;
  if (pendingCount > 0) {
    // A save is still queued for retry — warn before the tab/app closes, since
    // that change only exists in memory until this succeeds. Native browser
    // dialogs ignore custom text, but setting returnValue triggers the prompt.
    e.preventDefault();
    e.returnValue = '';
    flushPendingSaves(); // last-ditch attempt; not guaranteed to complete, but costs nothing to try
    return '';
  }
}

  document.addEventListener('touchstart', onSwipeTouchStart, { passive: true });
  document.addEventListener('touchmove', onSwipeTouchMove, { passive: false });
  document.addEventListener('touchend', onSwipeTouchEnd);
  window.addEventListener('beforeunload', onBeforeUnload);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushPendingSaves();
    else if (document.visibilityState === 'visible') readSyncFile(true); // just came back — pull in whatever another device may have written meanwhile
  });
  window.addEventListener('focus', () => readSyncFile(true));
  document.getElementById('import-file-input').addEventListener('change', onContentChange);
  window.addEventListener('scroll', onScrollForFab, { passive: true });
  document.addEventListener('scroll', trackOverlayScroll, { capture: true, passive: true });
  document.addEventListener('touchstart', onTooltipTouchStart, { passive: true });
  document.addEventListener('touchmove', onTooltipTouchMove, { passive: true });
  document.addEventListener('touchend', onTooltipTouchEnd, { passive: true });
}
let fabLastScrollY = 0;
function onScrollForFab(){
  if (fabMenuOpen) return; // never hide while the person is actively using it
  const fab = document.getElementById('fab-button');
  if (!fab) return;
  const y = window.scrollY;
  if (y > fabLastScrollY + 6 && y > 80) fab.classList.add('fab-hidden');
  else if (y < fabLastScrollY - 6 || y <= 80) fab.classList.remove('fab-hidden');
  fabLastScrollY = y;
}

async function init(){
  const [goal, checklist, calendar, leads, content, resources, activity, notes, links, trackedAccounts, savedLinks, qualifyConfig, navOrder, appSettings, meta, streak, ads, testimonials, shotList, brand, gamification, storyVault] = await Promise.all([
    loadKey('goal', null),
    loadKey('checklist', null),
    loadKey('calendar', { posts: [] }),
    loadKey('leads', []),
    loadKey('content', null),
    loadKey('resources', null),
    loadKey('activity', []),
    loadKey('notes', null),
    loadKey('links', []),
    loadKey('trackedAccounts', []),
    loadKey('savedLinks', []),
    loadKey('qualifyConfig', null),
    loadKey('navOrder', []),
    loadKey('settings', null),
    loadKey('meta', null),
    loadKey('streak', null),
    loadKey('ads', null),
    loadKey('testimonials', []),
    loadKey('shotList', null),
    loadKey('brand', null),
    loadKey('gamification', null),
    loadKey('storyVault', null),
  ]);

  state.goal = goal || { clients: 0, avgPrice: 0, target: DEFAULT_TARGET_MRR, deadline: DEFAULT_DEADLINE };
  if (state.goal.target === undefined) state.goal.target = DEFAULT_TARGET_MRR;
  if (state.goal.deadline === undefined) state.goal.deadline = DEFAULT_DEADLINE;
  state.calendar = calendar || { posts: [] };
  if (state.calendar.archivedPosts === undefined) state.calendar.archivedPosts = [];
  if (state.calendar.dayContentType === undefined) state.calendar.dayContentType = {};
  if (state.calendar.dayStoryType === undefined) state.calendar.dayStoryType = {};
  if (state.calendar.weekdayContentType === undefined) state.calendar.weekdayContentType = {};
  if (state.calendar.weekdayStoryType === undefined) state.calendar.weekdayStoryType = {};
  if (state.calendar.contentTypeRepeatWeeks === undefined) state.calendar.contentTypeRepeatWeeks = 1;
  if (state.content.customCategories === undefined) state.content.customCategories = [];
  if (state.brand.savedCTAs === undefined) state.brand.savedCTAs = [];
  state.leads = normalizeLeads(leads || []);
  state.content = content || { ideas: seedIdeas(), scripts: seedScripts() };
  state.resources = resources || seedResources();
  if (state.resources.mindsetNotes === undefined) state.resources.mindsetNotes = [];
  Object.values(state.resources.templates).forEach(t => { if (t.pinned === undefined) t.pinned = false; });
  state.activity = activity || [];
  state.links = links || [];
  state.trackedAccounts = trackedAccounts || [];
  state.savedLinks = savedLinks || [];
  state.navOrder = navOrder || [];
  state.settings = appSettings || { renewalWarnDays: 15, renewalDangerDays: 5, defaultPackageDuration: 90, followupReasons: null };
  if (state.settings.renewalWarnDays === undefined) state.settings.renewalWarnDays = 15;
  if (state.settings.renewalDangerDays === undefined) state.settings.renewalDangerDays = 5;
  if (state.settings.defaultPackageDuration === undefined) state.settings.defaultPackageDuration = 90;
  if (state.settings.followupReasons === undefined) state.settings.followupReasons = null;
  if (Array.isArray(state.settings.followupReasons) && state.settings.followupReasons.length) {
    FOLLOWUP_REASONS = state.settings.followupReasons;
  }
  // Merge saved config over the defaults field-by-field, so a field the
  // person never customized still gets the built-in options rather than
  // disappearing if the shape of the defaults ever changes later.
  if (qualifyConfig) {
    QUALIFY_FIELDS = JSON.parse(JSON.stringify(DEFAULT_QUALIFY_FIELDS));
    Object.keys(qualifyConfig).forEach(k => { QUALIFY_FIELDS[k] = qualifyConfig[k]; });
  }
  state.streak = streak || { count: 0, lastCompletedDate: null };
  state.ads = ads || { monthlyBudget: 0 };
  state.testimonials = testimonials || [];
  state.shotList = shotList || { items: [] };
  state.brand = brand || { name:'', subtitle:'', keyword:'', ctaText:'', baseLink:'', dmConversions:0, savedCTAs:[] };
  if (state.brand.savedCTAs === undefined) state.brand.savedCTAs = [];
  state.gamification = gamification || { xp: 0, milestonesShown: [] };
  state.storyVault = storyVault || { items: [], weeklyFlags: {} };
  if (state.storyVault.weeklyFlags === undefined) state.storyVault.weeklyFlags = {};
  // Backfill: older story items were created before "date" existed — assign
  // them their creation date so they still show up in the right day column
  // instead of vanishing from the new per-day Story view.
  state.storyVault.items.forEach(it => { if (!it.date) it.date = dateToISO(new Date(it.createdAt)); });
  notesState = notes || seedNotes();
  appMeta = meta || { lastBackupAt: null };
  checkStreakRollover(todayISO());

  const today = todayISO();
  const checklistUncertain = loadFailedKeys.has('checklist');
  if (checklistUncertain) {
    // We could not confirm whether a saved checklist exists — do NOT treat this
    // as "no data" and do NOT write anything back. Show an empty checklist for
    // THIS session only; a manual retry (or the next successful load) recovers
    // the real data without ever having overwritten it.
    state.checklist = { date: today, checked: {}, categories: seedChecklistCategories() };
  } else if (!checklist || checklist.date !== today) {
    state.checklist = {
      date: today,
      checked: {},
      categories: (checklist && checklist.categories) || seedChecklistCategories(),
    };
    saveKey('checklist', state.checklist);
  } else {
    state.checklist = checklist;
  }

  // Start every idea category collapsed — the person opens exactly the ones
  // they want to browse, instead of the page defaulting to a wall of cards.
  allIdeaCategories().forEach(cat => collapsedIdeaCategories.add(cat.id));

  // Same treatment for Resurse on mobile — it accumulates a group per
  // objection/topic over time and was turning into one very long scroll.
  // On desktop there's plenty of width/height to browse, so leave every
  // template group open by default there.
  if (window.innerWidth < 768) {
    (state.resources.groups || []).slice(1).forEach(g => collapsedResourceGroups.add(g.id));
  }

  bindEventsOnce();
  applyTabAccent(activeTab);
  await tryRestoreSyncHandle();
  tryRestoreGoogleDrive(); // fire-and-forget — never blocks first paint

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  if (!ANY_PERSISTENCE) toast('Persistență indisponibilă în acest mediu — datele nu se vor salva la refresh.', 'error');

  // A handful of missing keys is normal (e.g. a feature added after this person
  // last used the app — that key genuinely never existed for them). Only surface
  // the "couldn't confirm your data" warning when a large share of keys failed
  // together, which is the actual signature of a real connectivity/bridge outage
  // rather than a few legitimately-never-saved keys.
  if (loadFailedKeys.size >= 3) {
    dataLoadWarning = true;
    startDataLoadRetryWatcher();
  }

  render();
  startDayRolloverWatcher();
}

let lastKnownDate = null;
function startDayRolloverWatcher(){
  lastKnownDate = todayISO();
  setInterval(() => {
    const today = todayISO();
    if (today === lastKnownDate) return;
    lastKnownDate = today;
    checkStreakRollover(today);
    if (state.checklist.date !== today) {
      state.checklist = { date: today, checked: {}, categories: state.checklist.categories };
      saveKey('checklist', state.checklist);
    }
    saveKey('streak', state.streak);
    render();
    toast('O zi nouă a început — checklist-ul s-a resetat.');
  }, 60000);
}

init();

})();
</script>
<script>
  // Registered outside the app's own IIFE — the service worker is optional,
  // static-hosting infrastructure and shouldn't be able to affect app state
  // if anything about it ever fails. Silently no-ops if sw.js isn't present
  // at this path (e.g. opened locally rather than deployed).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
